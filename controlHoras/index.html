<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;
const {BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,Cell} = Recharts;

// ── Configuración por defecto ──────────────────────────────
const DEFAULT_CONFIG = {
  rateNormal:9.6696, plusFestivo:7.25, profile:"ett",
  sintaxUnlocked:false, rateExtra:0, hideMoney:false,
  apiKey:"", // Clave Anthropic para el chat IA
  deductions:[
    {id:"d1",name:"Retención IRPF",pct:2.0},
    {id:"d2",name:"Contingencias comunes",pct:4.7},
    {id:"d3",name:"Desempleo",pct:1.6},
    {id:"d4",name:"Formación profesional",pct:0.1},
    {id:"d5",name:"MEI",pct:0.15},
  ]
};

const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MESES_C=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const DIAS=["L","M","X","J","V","S","D"];
const TYPES={normal:{label:"Normal",color:"#4FA3FF",bg:"rgba(79,163,255,0.18)"},festivo:{label:"Festivo",color:"#FFB04F",bg:"rgba(255,176,79,0.20)"},descanso:{label:"Descanso",color:"#FF6B6B",bg:"rgba(255,107,107,0.18)"}};
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n||0);
const MASK="•••• €";
const mk=(y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;
const extraActive=cfg=>cfg.profile==="sintax"&&cfg.sintaxUnlocked;
const SINTAX_PASS="Sintax_Granada";

function hoursColor(h){
  if(h<9.5)return"#C9D2E3";
  const t=Math.min(1,(h-9.5)/2.5);
  const c=[255,176,79].map((v,i)=>Math.round(v+([255,56,56][i]-v)*t));
  return`rgb(${c[0]},${c[1]},${c[2]})`;
}

function getEntry(allData,date){
  const rec=allData[mk(date.getFullYear(),date.getMonth())];
  return rec?.days?.[date.getDate()]||null;
}

function calcExtraMap(allData,year,month,dim){
  const map={};
  const first=new Date(year,month,1);
  let mon=new Date(year,month,1-((first.getDay()+6)%7));
  const end=new Date(year,month,dim);
  while(mon<=end){
    const wk=[];let tot=0;
    for(let i=0;i<7;i++){
      const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
      const e=getEntry(allData,d);
      const h=e&&e.type!=="descanso"?Number(e.hours)||0:0;
      tot+=h;wk.push({date:d,e,h});
    }
    let extra=Math.max(0,tot-40);
    if(extra>0){
      for(let i=6;i>=0&&extra>0;i--){
        const{date,e,h}=wk[i];
        if(!e||e.type!=="normal"||h<=0)continue;
        const take=Math.min(h,extra);extra-=take;
        if(date.getFullYear()===year&&date.getMonth()===month)
          map[date.getDate()]=(map[date.getDate()]||0)+take;
      }
    }
    mon=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+7);
  }
  return map;
}

function calcExtraInfo(allData,year,month,dim){
  const gen=calcExtraMap(allData,year,month,dim);
  const pDate=new Date(year,month-1,1);
  const py=pDate.getFullYear(),pm=pDate.getMonth();
  const pdim=new Date(py,pm+1,0).getDate();
  const prev=calcExtraMap(allData,py,pm,pdim);
  const sum=m=>Object.values(m).reduce((s,h)=>s+h,0);
  return{hGen:sum(gen),hPrev:sum(prev)};
}

function calcMonth(days,cfg,dim,ei=null){
  let hN=0,hF=0,dT=0,dD=0;
  for(let d=1;d<=dim;d++){
    const e=days?.[d];if(!e)continue;
    if(e.type==="descanso"){dD++;continue;}
    const h=Number(e.hours)||0;
    if(h>0)dT++;
    if(e.type==="festivo")hF+=h;else hN+=h;
  }
  const useX=ei&&extraActive(cfg);
  const hXG=useX?ei.hGen:0,hX=useX?ei.hPrev:0;
  const hNP=hN-hXG;
  const bN=hNP*cfg.rateNormal,bX=hX*cfg.rateExtra;
  const bF=hF*(cfg.rateNormal+cfg.plusFestivo);
  const bruto=bN+bF+bX;
  const dets=cfg.deductions.map(d=>({...d,amount:(bruto*d.pct)/100}));
  const totDed=dets.reduce((s,d)=>s+d.amount,0);
  return{hNormal:hN,hNormalPaid:hNP,hFestivo:hF,hExtra:hX,hExtraGen:hXG,diasTrab:dT,diasDesc:dD,bruto,brutoNormal:bN,brutoFestivo:bF,brutoExtra:bX,dets,totalDed:totDed,neto:bruto-totDed};
}

// ── Exportar informe como texto ────────────────────────────
const eurT=n=>(n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";

function textMonth(allData,cfg,yy,mm){
  const k=mk(yy,mm);
  const rec=allData[k]||{days:{}};
  const dim=new Date(yy,mm+1,0).getDate();
  const ei=extraActive(cfg)?calcExtraInfo(allData,yy,mm,dim):null;
  const c=calcMonth(rec.days||{},cfg,dim,ei);
  const L=[];
  L.push(`RESUMEN DE HORAS — ${MESES[mm].toUpperCase()} ${yy}${rec.closed?" (CERRADO)":""}`);
  L.push(`Tarifa normal ${cfg.rateNormal.toFixed(4)} €/h  ·  Festivo ${(cfg.rateNormal+cfg.plusFestivo).toFixed(4)} €/h`);
  L.push("");
  let any=false;
  for(let d=1;d<=dim;d++){
    const e=(rec.days||{})[d];if(!e)continue;any=true;
    const h=Number(e.hours)||0;
    const imp=e.type==="descanso"?0:h*(cfg.rateNormal+(e.type==="festivo"?cfg.plusFestivo:0));
    L.push(e.type==="descanso"?`${d} ${MESES_C[mm]}  Descanso`:`${d} ${MESES_C[mm]}  ${TYPES[e.type].label}  ${h} h  ${eur(imp)}`);
  }
  if(!any)L.push("Sin días registrados este mes.");
  L.push("");
  L.push(`Días trabajados: ${c.diasTrab}  ·  Descansos: ${c.diasDesc}  ·  H. normales: ${c.hNormalPaid}  ·  H. festivas: ${c.hFestivo}`);
  if(extraActive(cfg))L.push(`Extras cobradas de ${MESES[(mm+11)%12].toLowerCase()}: ${c.hExtra} h (${eur(c.brutoExtra)})  ·  Generadas: ${c.hExtraGen} h`);
  L.push(`Total bruto: ${eur(c.bruto)}`);
  c.dets.forEach(d=>L.push(`  ${d.name} (${d.pct}%): -${eur(d.amount)}`));
  L.push(`NETO ESTIMADO: ${eur(c.neto)}`);
  L.push("");L.push(`Diseñado por FOlea © ${yy}`);
  return L.join("\n");
}

function textYear(allData,cfg,yy){
  const L=[`RESUMEN ANUAL — ${yy}`,""];
  let tB=0,tN=0,tD=0,tH=0;const withData=[];
  for(let m=0;m<12;m++){
    const rec=allData[mk(yy,m)];
    if(!rec||!Object.keys(rec.days||{}).length)continue;
    const dim=new Date(yy,m+1,0).getDate();
    const c=calcMonth(rec.days,cfg,dim,extraActive(cfg)?calcExtraInfo(allData,yy,m,dim):null);
    L.push(`${MESES[m]}: ${c.diasTrab} días  ${c.hNormal+c.hFestivo} h  Bruto ${eur(c.bruto)}  Neto ${eur(c.neto)}`);
    tB+=c.bruto;tN+=c.neto;tD+=c.diasTrab;tH+=c.hNormal+c.hFestivo;withData.push(m);
  }
  L.push("",`TOTAL ${yy}: ${tD} días  ${tH} h  Bruto ${eur(tB)}  NETO ${eur(tN)}`);
  withData.forEach(m=>{L.push("","──────────────────","",textMonth(allData,cfg,yy,m));});
  return L.join("\n");
}

async function shareReport(title,text){
  if(navigator.share){
    try{await navigator.share({title,text});return true;}
    catch(e){if(e?.name==="AbortError")return true;}
  }
  return false;
}
async function copyReport(text){
  try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  try{
    const ta=document.createElement("textarea");ta.value=text;
    document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();return true;
  }catch(e){return false;}
}

// ── PIN: hash con Web Crypto ───────────────────────────────
const PIN_KEY = "horas-pin-hash";
async function hashPin(pin) {
  const data = new TextEncoder().encode(pin + ":folea:horas");
  const buf = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
async function verifyPin(pin) {
  const stored = localStorage.getItem(PIN_KEY);
  if (!stored) return true; // sin PIN configurado = desbloqueado
  return (await hashPin(pin)) === stored;
}

// ── Pantalla de bloqueo ────────────────────────────────────
function LockScreen({ onUnlock, hasPin }) {
  const [digits, setDigits] = useState("");
  const [error, setError] = useState(false);
  const [step, setStep] = useState(1); // 1=intro, 2=confirmar (solo setup)
  const [temp, setTemp] = useState("");
  const isSetup = !hasPin;

  const add = async (d) => {
    const next = digits + d;
    setDigits(next);
    setError(false);
    if (next.length < 4) return;
    // 4+ dígitos: procesar
    if (isSetup) {
      if (step === 1) { setTemp(next); setDigits(""); setStep(2); return; }
      // paso 2: confirmar
      if (next !== temp) { setError(true); setDigits(""); setStep(1); setTemp(""); return; }
      const h = await hashPin(next);
      localStorage.setItem(PIN_KEY, h);
      onUnlock();
    } else {
      if (await verifyPin(next)) { onUnlock(); }
      else { setError(true); setDigits(""); }
    }
  };
  const del = () => { setError(false); setDigits(d => d.slice(0, -1)); };

  return (
    <div style={{ minHeight:"100vh", background:"#11151F", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24 }}>
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7BE8A8" strokeWidth="1.5" strokeLinecap="round" style={{ marginBottom:20 }}>
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <div style={{ fontFamily:"'Space Grotesk',system-ui", fontWeight:700, fontSize:22, color:"#E8EDF7", marginBottom:6 }}>
        {isSetup ? (step===1 ? "Elige un PIN" : "Confirma el PIN") : "Introduce tu PIN"}
      </div>
      <div style={{ color:"#8B93A7", fontSize:13, marginBottom:28, textAlign:"center", lineHeight:1.5 }}>
        {isSetup ? (step===1 ? "Mínimo 4 dígitos para proteger tus datos" : "Repite el PIN para confirmar") : "Control de Horas · Diseñado por FOlea"}
      </div>

      {/* Puntos indicadores */}
      <div style={{ display:"flex", gap:12, marginBottom:28 }}>
        {Array.from({length: Math.max(4, digits.length)}).map((_,i) => (
          <div key={i} style={{ width:14, height:14, borderRadius:"50%", background: i < digits.length ? "#7BE8A8" : "#2A3247", border:"2px solid", borderColor: i < digits.length ? "#7BE8A8" : "#3A4257", transition:"all .15s" }}/>
        ))}
      </div>

      {error && <div style={{ color:"#FF8B8B", fontSize:13, marginBottom:16 }}>{isSetup ? "Los PINs no coinciden. Inténtalo de nuevo." : "PIN incorrecto. Inténtalo de nuevo."}</div>}

      {/* Teclado numérico */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, width:"100%", maxWidth:280 }}>
        {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i) => (
          <button key={i} onClick={() => k === "⌫" ? del() : k !== "" ? add(String(k)) : null}
            style={{ height:64, borderRadius:16, border:"1px solid #2A3247", background: k==="⌫" ? "rgba(255,107,107,0.1)" : "rgba(255,255,255,0.04)", color: k==="⌫" ? "#FF8B8B" : "#E8EDF7", fontSize: k==="⌫" ? 20 : 24, fontWeight:600, opacity: k===""?0:1, cursor: k===""?"default":"pointer" }}>
            {k}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Componente principal ───────────────────────────────────
function ControlHoras(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [config,setConfig]=useState(DEFAULT_CONFIG);
  const [allData,setAllData]=useState({});
  const [sel,setSel]=useState(null);
  const [draft,setDraft]=useState(null);
  const [confirmed,setConfirmed]=useState(false);
  const [tab,setTab]=useState("mes");
  const [loading,setLoading]=useState(true);
  const [saveState,setSaveState]=useState("idle");
  const [pwInput,setPwInput]=useState("");
  const [pwError,setPwError]=useState(false);
  const [nomina,setNomina]=useState({status:"idle",result:null,error:null});
  const fileRef=useRef(null);
  const backupRef=useRef(null);
  const [chat,setChat]=useState([]);
  const [chatIn,setChatIn]=useState("");
  const [chatLoad,setChatLoad]=useState(false);
  const chatEnd=useRef(null);
  const [expOpen,setExpOpen]=useState(false);
  const [expReady,setExpReady]=useState(null);
  const [showApiKey,setShowApiKey]=useState(false);
  // ── Seguridad: PIN lock ──────────────────────────────────
  const [locked, setLocked] = useState(true);
  const [hasPin, setHasPin] = useState(!!localStorage.getItem(PIN_KEY));
  const [changingPin, setChangingPin] = useState(false);

  // Bloquear al minimizar / cambiar pestaña
  useEffect(() => {
    const onHide = () => { if (localStorage.getItem(PIN_KEY)) setLocked(true); };
    document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); });
    window.addEventListener("blur", onHide);
    return () => { document.removeEventListener("visibilitychange", onHide); window.removeEventListener("blur", onHide); };
  }, []);

  const lockApp = () => { if (localStorage.getItem(PIN_KEY)) setLocked(true); else alert("Configura un PIN primero en Ajustes → Seguridad."); };
  const removePin = () => { if (window.confirm("¿Eliminar el PIN? La app quedará sin protección.")) { localStorage.removeItem(PIN_KEY); setHasPin(false); } };


  const hide=!!config.hideMoney;
  const fmt=n=>hide?MASK:eur(n);
  const toggleHide=()=>setConfig(c=>({...c,hideMoney:!c.hideMoney}));

  const expYears=useMemo(()=>{
    const ys=new Set(Object.keys(allData).filter(k=>Object.keys(allData[k]?.days||{}).length).map(k=>Number(k.slice(0,4))));
    ys.add(year);ys.add(today.getFullYear());
    return[...ys].sort((a,b)=>b-a);
  },[allData,year]);

  // ── localStorage ──────────────────────────────────────────
  useEffect(()=>{
    try{
      const s=localStorage.getItem("horas-app-v2");
      if(s){
        const p=JSON.parse(s);
        if(p.config){const cfg={...DEFAULT_CONFIG,...p.config};cfg.deductions=(p.config.deductions||DEFAULT_CONFIG.deductions).map((d,i)=>({id:d.id||"d"+(i+1),...d}));setConfig(cfg);}
        if(p.data)setAllData(p.data);
      } else {
        const old=localStorage.getItem("horas-app");
        if(old){
          const po=JSON.parse(old);
          if(po.config)setConfig(c=>({...c,...po.config,deductions:(po.config.deductions||c.deductions).map((d,i)=>({id:"d"+(i+1),...d}))}));
          if(po.data){const m={};for(const[k,v]of Object.entries(po.data))m[k]={days:v,closed:false};setAllData(m);}
        }
      }
    }catch(e){}
    setLoading(false);
  },[]);

  useEffect(()=>{
    if(loading)return;
    setSaveState("saving");
    const t=setTimeout(()=>{
      try{localStorage.setItem("horas-app-v2",JSON.stringify({config,data:allData}));setSaveState("saved");setTimeout(()=>setSaveState("idle"),1500);}
      catch(e){setSaveState("error");}
    },600);
    return()=>clearTimeout(t);
  },[config,allData,loading]);

  // ── Derived ───────────────────────────────────────────────
  const key=mk(year,month);
  const rec=allData[key]||{days:{},closed:false};
  const monthData=rec.days||{};
  const isClosed=!!rec.closed;
  const dim=new Date(year,month+1,0).getDate();
  const fw=(new Date(year,month,1).getDay()+6)%7;
  const isCurrent=month===today.getMonth()&&year===today.getFullYear();
  const ei=useMemo(()=>extraActive(config)?calcExtraInfo(allData,year,month,dim):null,[allData,year,month,dim,config]);
  const calc=useMemo(()=>calcMonth(monthData,config,dim,ei),[monthData,config,dim,ei]);

  const projection=useMemo(()=>{
    if(!isCurrent)return null;
    const el=today.getDate(),rem=dim-el;
    if(rem<=0)return null;
    let wH=0,wD=0;
    for(let d=1;d<=el;d++){const e=monthData[d];if(!e||e.type==="descanso")continue;const h=Number(e.hours)||0;if(h>0){wD++;wH+=h;}}
    if(wD<3)return null;
    const avg=wH/wD;
    const wIdx=d=>{const date=new Date(year,month,d);const mon=new Date(date);mon.setDate(d-((date.getDay()+6)%7));return mon.getTime();};
    const rByW={};
    for(let d=1;d<=el;d++){const w=wIdx(d);if(!(w in rByW))rByW[w]=0;if(monthData[d]?.type==="descanso")rByW[w]++;}
    const cW=wIdx(el);
    const done=Object.entries(rByW).filter(([w])=>Number(w)!==cW);
    const rpw=done.length?Math.max(1,Math.round(done.reduce((s,[,r])=>s+r,0)/done.length)):1;
    let pRD=0;const fR={};fR[cW]=rByW[cW]||0;
    for(let d=el+1;d<=dim;d++){
      const w=wIdx(d);if(!(w in fR))fR[w]=0;
      if(fR[w]<rpw){const date=new Date(year,month,d);const dow=(date.getDay()+6)%7;const dlw=Math.min(6-dow,dim-d);if(dlw<rpw-fR[w]){fR[w]++;pRD++;continue;}}
    }
    const pWD=rem-pRD,pBruto=calc.bruto+pWD*avg*config.rateNormal;
    const pDed=config.deductions.reduce((s,d)=>s+(pBruto*d.pct)/100,0);
    return{avg,pWD,pRD,rpw,pBruto,pNeto:pBruto-pDed,rem};
  },[isCurrent,monthData,calc,config,dim,year,month]);

  const annual=useMemo(()=>{
    const rows=[];
    for(let m=0;m<12;m++){
      const k=mk(year,m);const r=allData[k];
      const d=new Date(year,m+1,0).getDate();
      const c=r?calcMonth(r.days,config,d,extraActive(config)?calcExtraInfo(allData,year,m,d):null):null;
      rows.push({m,name:MESES_C[m],neto:c?Math.round(c.neto*100)/100:0,bruto:c?.bruto||0,horas:c?c.hNormal+c.hFestivo:0,dias:c?.diasTrab||0,closed:!!r?.closed,hasData:!!(r&&Object.keys(r.days||{}).length)});
    }
    const tN=rows.reduce((s,r)=>s+r.neto,0),tB=rows.reduce((s,r)=>s+r.bruto,0);
    const tH=rows.reduce((s,r)=>s+r.horas,0),tD=rows.reduce((s,r)=>s+r.dias,0);
    return{rows,tN,tB,tH,tD};
  },[allData,config,year]);

  // ── Acciones ──────────────────────────────────────────────
  const setDay=(d,patch)=>{
    if(isClosed)return;
    setAllData(prev=>{const r=prev[key]||{days:{},closed:false};const days={...r.days};days[d]={...(days[d]||{type:"normal",hours:8}),...patch};return{...prev,[key]:{...r,days}};});
  };
  const clearDay=d=>{
    if(isClosed)return;
    setAllData(prev=>{const r=prev[key]||{days:{},closed:false};const days={...r.days};delete days[d];return{...prev,[key]:{...r,days}};});
    setSel(null);
  };
  const toggleClosed=()=>{setAllData(prev=>{const r=prev[key]||{days:{},closed:false};return{...prev,[key]:{...r,closed:!r.closed}};});setSel(null);};
  const nav=dir=>{setSel(null);let m=month+dir,y=year;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setMonth(m);setYear(y);};

  // ── Chat IA ───────────────────────────────────────────────
  function chatCtx(){
    const compact={};
    for(const[k,r]of Object.entries(allData)){const days={};for(const[d,e]of Object.entries(r.days||{}))days[d]=e.type==="descanso"?"D":(e.type==="festivo"?"F":"N")+(Number(e.hours)||0);if(Object.keys(days).length)compact[k]={cerrado:!!r.closed,dias:days};}
    const tp=config.deductions.reduce((s,d)=>s+(Number(d.pct)||0),0);
    return`Eres el asistente de una app de control de horas español. Responde en español, directo, sin markdown. Haz cálculos precisos.\nFECHA: ${today.toLocaleDateString("es-ES")}\nTARIFAS: normal ${config.rateNormal}€/h, festivo ${(config.rateNormal+config.plusFestivo).toFixed(4)}€/h, perfil ${config.profile==="sintax"?"Sintax":"ETT"}\nRETENCIONES: ${config.deductions.map(d=>`${d.name} ${d.pct}%`).join(", ")} (total ${tp.toFixed(2)}%)\nREGISTROS: ${JSON.stringify(compact)}\nSi no hay datos suficientes, dilo claramente.`;
  }

  async function sendChat(txt){
    const q=(txt??chatIn).trim();if(!q||chatLoad)return;
    if(!config.apiKey){setChat([...chat,{r:"user",c:q},{r:"assistant",c:"⚠ Para usar el chat IA necesitas introducir tu API Key de Anthropic en Ajustes → IA (API Key)."}]);setChatIn("");return;}
    const msgs=[...chat,{r:"user",c:q}];setChat(msgs);setChatIn("");setChatLoad(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":config.apiKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:chatCtx()},{role:"assistant",content:"Entendido."},{...msgs.map(m=>({role:m.r,content:m.c}))}].flat()})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      const reply=(data.content||[]).map(i=>i.type==="text"?i.text:"").join("").trim();
      setChat([...msgs,{r:"assistant",c:reply||"Sin respuesta, inténtalo de nuevo."}]);
    }catch(e){setChat([...msgs,{r:"assistant",c:"⚠ Error: "+(e.message||"Fallo de conexión.")}]);}
    setChatLoad(false);
  }

  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"});},[chat,chatLoad]);

  // ── Comprobar nómina ──────────────────────────────────────
  async function checkNomina(file){
    if(!file)return;
    if(!config.apiKey){setNomina({status:"done",result:{estado:"ilegible",resumen:"Necesitas introducir tu API Key de Anthropic en Ajustes para usar esta función.",diferencias:[],observaciones:[]},error:null});return;}
    setNomina({status:"loading",result:null,error:null});
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("No se pudo leer"));r.readAsDataURL(file);});
      const appData={mes:`${MESES[month]} ${year}`,tarifas:{horaNormal:config.rateNormal,horaFestiva:config.rateNormal+config.plusFestivo},horas:{normales:calc.hNormalPaid,festivas:calc.hFestivo},diasTrabajados:calc.diasTrab,diasDescanso:calc.diasDesc,brutoCalculado:Math.round(calc.bruto*100)/100,retencionesCalculadas:calc.dets.map(d=>({concepto:d.name,porcentaje:d.pct,importe:Math.round(d.amount*100)/100})),netoCalculado:Math.round(calc.neto*100)/100};
      const prompt=`Eres un experto en nóminas españolas. Compara el PDF con estos datos y devuelve SOLO JSON: {"estado":"cuadra"|"no_cuadra"|"ilegible","resumen":"...","diferencias":[{"concepto":"...","nomina":"...","app":"...","comentario":"..."}],"observaciones":["..."]}\nDATOS APP: ${JSON.stringify(appData)}`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":config.apiKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},{type:"text",text:prompt}]}]})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      const text=(data.content||[]).map(i=>i.type==="text"?i.text:"").join("");
      setNomina({status:"done",result:JSON.parse(text.replace(/```json|```/g,"").trim()),error:null});
    }catch(e){setNomina({status:"error",result:null,error:e.message||"Error"});}
  }

  // ── Exportar ──────────────────────────────────────────────
  const doExportMonth=async()=>{
    const text=textMonth(allData,config,year,month);
    const title=`Horas_${MESES[month]}_${year}`;
    setExpReady({text,title});
    await shareReport(title,text);
  };
  const doExportYear=async(yy=year)=>{
    const text=textYear(allData,config,yy);
    const title=`Horas_${yy}_completo`;
    setExpReady({text,title});
    await shareReport(title,text);
  };

  const doExportBackup=async()=>{
    const text=JSON.stringify({app:"control-horas",version:2,exportado:new Date().toISOString(),config,data:allData},null,2);
    const title=`CopiaHoras_${new Date().toISOString().slice(0,10)}`;
    if(!(await shareReport(title+".json",text))){
      if(await copyReport(text))alert("✓ Copia copiada al portapapeles. Pégala en Notas o un email.");
    }
  };

  const doImport=file=>{
    if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        const fixed={};
        for(const[k,v]of Object.entries(p.data||{}))fixed[k]=v&&v.days?v:{days:v||{},closed:false};
        if(p.config){const cfg={...DEFAULT_CONFIG,...p.config};cfg.deductions=(p.config.deductions||DEFAULT_CONFIG.deductions).map((d,i)=>({id:d.id||"d"+(i+1),...d}));setConfig(cfg);}
        setAllData(fixed);
        alert("✓ Datos importados correctamente.");
      }catch(e){alert("Archivo no válido.");}
    };
    r.readAsText(file);
  };

  const closeExp=()=>{setExpOpen(false);setExpReady(null);};

  if(loading)return<div style={{minHeight:"100vh",background:"#11151F",color:"#8B93A7",display:"flex",alignItems:"center",justifyContent:"center"}}>Cargando…</div>;

  // Pantalla de bloqueo / setup de PIN
  if (locked || (!hasPin && !localStorage.getItem(PIN_KEY) === false) || changingPin) {
    if (locked || changingPin) {
      return <LockScreen hasPin={hasPin && !changingPin} onUnlock={() => {
        setLocked(false);
        if (changingPin) { setHasPin(true); setChangingPin(false); }
        else if (!hasPin) { setHasPin(true); }
      }} />;
    }
  }

  return(
<div className="app-root" style={S.app}>

`}</style>

      <button style={{...S.bigBtn,borderColor:"#4FA3FF",color:"#4FA3FF"}} onClick={()=>setExpOpen(true)}>📄 Exportar</button>
    </div>
  </div>
</div></div>}

// ── Componentes pequeños ──────────────────────────────────
function MRow({label,val,bold,muted,accent}){
  return<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0"}}>
    <span style={{color:muted?"#8B93A7":"#C9D2E3",fontSize:13,fontWeight:bold?600:400}}>{label}</span>
    <span style={{color:accent?"#7BE8A8":muted?"#8B93A7":"#E8EDF7",fontWeight:bold?700:500,fontSize:bold?15:13,fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{val}</span>
  </div>;
}
function CfgInput({label,val,onChange}){
  return<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",gap:12}}>
    <span style={{color:"#8B93A7",fontSize:13,flex:1}}>{label}</span>
    <input type="number" inputMode="decimal" step="0.01" value={val} onChange={e=>onChange(e.target.value===""?0:Number(e.target.value))} style={S.cfgInput}/>
  </div>;
}
