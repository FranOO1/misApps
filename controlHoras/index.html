  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    
    :root {
      --bg: #11151F; --card: #171C2A; --text: #E8EDF7; --muted: #AFB8CC;
      --border: #2A3247; --border-light: #1E2434;
      --accent: #4FA3FF; --success: #7BE8A8; --warning: #FFB04F; --danger: #FF8B8B;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    input, select { font-family: inherit; outline: none; }
    
    .app-root { max-width: 640px; margin: 0 auto; padding: 8px 10px; display: flex; flex-direction: column; flex: 1; width: 100%; }
    
    .tabs-bar { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; margin-bottom: 6px; flex: 0 0 auto; width:100%; padding:4px; border:1px solid #2B374B; border-radius:14px; background:#171F2D; }
    .view-selector { display: flex; flex: 0 0 112px; padding: 2px; gap: 2px; background: #101825; border: 1px solid transparent; border-radius: 11px; }
    .tab-btn { min-width: 44px; min-height: 44px; padding: 8px 5px; border-radius: 9px; color: #AFB8CC; font-size: 13px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: background-color .15s,color .15s; }
    .view-selector .tab-btn { flex: 1; }
    .tab-btn.active { background: #263F5F; color: #EEF6FF; }
    .view-selector .tab-btn.active { background: #263F5F; color: #EEF6FF; }
    .nav-link { flex: 1 0 auto; }
    .nav-icon { flex: 0 0 44px; width: 44px; padding: 0; }
    .hours-breakdown { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .eye-btn { width: 44px; flex: 0 0 44px; border-radius: 9px; color: var(--muted); display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0; }
    .nav-group { display:flex; align-items:center; gap:2px; }
    .nav-tools { margin-left:auto; }
    .nav-tools [data-tip]::after { left:auto; right:0; transform:none; }
    .tabs-bar svg { width:21px; height:21px; flex:0 0 21px; }
    .tabs-bar .tab-btn,.tabs-bar .eye-btn { color:#ACB7CA; }
    .tabs-bar .tab-btn.active { color:#EEF6FF; }
    .tabs-bar .eye-btn.active { color:#FFCE8A; background:rgba(255,176,79,.08); }
    @media (max-width:379px) { .view-selector { flex-basis:108px; } .tabs-bar { gap:2px; } }
    @media (max-width:300px) { .tabs-bar { flex-wrap:wrap; } .nav-tools { flex-basis:100%; justify-content:flex-end; } }
    [data-tip] { position: relative; }
    [data-tip]:focus-visible::after,[data-tip]:active::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 6px 8px; border-radius: 7px; background: #2A3247; color: var(--text); font-size: 12px; white-space: nowrap; z-index: 5; }
    .history-card { width: 100%; }
    .history-month { min-width: 0; padding: 10px; border: 1px solid #43516A; border-radius: 12px; background: var(--month-tone); }
    .history-select { width: 100%; min-height: 72px; padding: 0 0 8px; background: transparent; border: 0; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
    .history-select span { display: block; margin-top: 6px; font-size: 14px; }
    .history-month strong { display: block; font-size: 15px; color: #E8EDF7; }
    .history-month small { display: block; margin-top: 5px; color: #C0C8D8; font-size: 11px; }
    .history-month[data-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: linear-gradient(rgba(79,163,255,.15),rgba(79,163,255,.15)),var(--month-tone); }
    .history-month .report-download { min-height: 44px; padding: 8px 5px; font-size: 12px; }
    .big-btn.report-download { background: #193833; border-color: #367C65; color: #9FE5C8; }
    .chat-card { display: flex; flex-direction: column; }
    .chat-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .chat-heading h2 { font-size: 17px; margin: 0; }
    .chat-reset { min-height: 44px; padding: 6px 9px; border-radius: 9px; color: var(--muted); font-size: 12px; }
    .chat-messages { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 12px; min-height: 180px; }
    .chat-card .bubble { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
    .bubble.user { white-space: pre-wrap; }
    .bubble p { margin: 0 0 7px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul,.bubble ol { margin: 6px 0; padding-left: 20px; }
    .chat-period { font-size: 12px; color: #9FCBFF; font-weight: 600; margin-bottom: 8px; }
    .chat-net table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    .chat-net th,.chat-net td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    .chat-net caption { text-align: left; margin-bottom: 8px; font-weight: 600; }
    .chat-net .privacy-note { margin-top: 8px; }
    @media (min-width: 840px) and (min-height: 540px) { .ia-wrap { overflow-y: auto; padding-right: 6px; } }

    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-year summary { padding: 12px 0; min-height: 44px; cursor: pointer; font-weight: 600; }
    .history-months { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin: 8px 0; }
    @media (min-width:700px) { .history-months { grid-template-columns: repeat(3,minmax(0,1fr)); } }
    .report-field { display: flex; flex-direction: column; gap: 5px; margin: 9px 0; font-size: 13px; min-width: 0; }
    .report-field input,.report-field select,.report-field textarea { width: 100%; min-height: 44px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 9px; border-radius: 9px; font-size: 16px; }
    .report-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .payroll-line { padding: 12px; margin: 12px 0; border: 1px solid var(--border); border-radius: 12px; }
    .report-choice { display: flex; align-items: center; gap: 10px; min-height: 46px; margin: 10px 0; font-size: 13px; }
    .report-choice input { width: 22px; height: 22px; flex: 0 0 22px; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .report-actions .big-btn { flex: 1 1 170px; }
    .report-preview { width: 100%; min-height: 180px; font-size: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
    .eye-btn.active { color: #CFD7E5; }
    
    .tab-content { flex: 1; display: flex; flex-direction: column;  }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .two-col, .ajustes-grid { display: block; }
    
    .card { background: var(--card); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .big-btn { width: 100%; padding: 12px 10px; border-radius: 14px; border: 1.5px solid var(--border); background: rgba(255,255,255,0.03); color: #C9D2E3; font-size: 14px; font-weight: 600; text-align: center; }
    .config-input { width: 90px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
    
    .neto-block { text-align: center; padding: 7px 10px; border-radius: 16px; background: linear-gradient(160deg, rgba(79,163,255,0.1), rgba(123,232,168,0.07)); border: 1px solid var(--border); margin-bottom: 8px;}
    .neto-value { font-family: 'Space Grotesk', system-ui; font-weight: 700; font-size: 30px; color: var(--success); margin: 2px 0; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
    .day-cell { min-height: 44px; aspect-ratio: auto; border-radius: 10px; border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); padding:0; transition: border-color 0.15s; }
    .day-cell.today { border-color: var(--accent); }
    .day-cell span:first-child { font-size: 13px; font-weight: 600; }
    .day-cell span + span { font-size: 11px; max-width: 100%; overflow-wrap: anywhere; }
    
    .editor { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px; margin-bottom: 8px; }
    .type-btn { flex: 1; padding: 10px 0; border-radius: 12px; border: 1.5px solid var(--border); font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); }
    .hours-input { width: 80px; padding: 7px 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 20px; font-weight: 700; text-align: center; font-family: 'Space Grotesk', system-ui; }
    .step-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 22px; }
    .add-btn { width: 100%; padding: 10px 0; border-radius: 14px; background: linear-gradient(100deg, #3FD68C, #7BE8A8); color: #0E1420; font-size: 15px; font-weight: 700; font-family: 'Space Grotesk', system-ui; }
    .day-earn-box { text-align: center; padding: 14px 12px; border-radius: 14px; background: linear-gradient(160deg, rgba(123,232,168,0.08), rgba(63,214,140,0.03)); border: 1px solid rgba(123,232,168,0.2); }

    .week-banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-radius: 12px; padding: 6px 8px; margin-bottom: 4px; background: linear-gradient(160deg, rgba(79,163,255,0.10), rgba(79,163,255,0.03)); border: 1px solid var(--border);  }
    
    .bubble { max-width: 85%; border-radius: 14px; border: 1px solid; padding: 9px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { max-width:88%; background:#005C4B; border-color:rgba(233,237,239,.12); margin-left:auto; margin-right:0; color:#E9EDEF; padding:10px 13px; overflow-wrap:anywhere; white-space:pre-wrap; }
    .bubble.bot { background: var(--border-light); border-color: var(--border); margin-right: auto; color: var(--text); }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(8,10,16,0.72); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    
    .watermark { text-align: center; padding: 20px 0 10px; color: #AFB8CC; font-size: 11px; letter-spacing: 0.5px; opacity: 1; font-family: 'Space Grotesk', system-ui; text-transform: uppercase; font-weight: 600; margin-top: auto; }

    @media (min-width: 840px) and (min-height: 540px) {
      .app-root { max-width: 1240px; height: 100vh; overflow: hidden; padding-bottom: 0; }
      .tabs-bar { width:100%; margin:0 0 8px; }
      .tab-content { overflow: hidden; }
      .two-col, .ajustes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; height: 100%; min-height: 0; align-items: stretch; }
      .col-scroll { overflow-y: auto; height: 100%; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .col-scroll::-webkit-scrollbar { width: 6px; }
      .col-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      .ia-wrap { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; width: 100%; }
      .watermark { padding: 10px 0; }
    }
    button, input, select { min-height: 44px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    input, select, textarea { font-size: 16px; }
    .big-btn { min-width: 44px; }
    .eye-btn { min-width: 44px; }
    .row { gap: 8px; flex-wrap: wrap; }
    .row > span, .col-scroll, .card, .neto-block { min-width: 0; }
    .card, .neto-block { overflow-wrap: anywhere; }
    .config-input { min-width: 0; max-width: 100%; }
    .day-cell span { line-height: 1.4; }
    .month-details { margin-bottom: 8px; }
    .month-details > summary { min-height: 44px; padding: 10px 4px; color: var(--muted); font-weight: 600; cursor: pointer; }
    .month-details[open] > summary { margin-bottom: 6px; }
    .tab-enter { animation: fadeIn 180ms ease-out; }
    .money-detail { font-size: 12px; color: var(--text); line-height: 1.35; }
    .hours-total { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .privacy-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
    button:disabled { opacity: .65; cursor: default; }
    .modal { max-height: 90dvh; overflow-y: auto; }
    @media (max-width: 360px) {
      .app-root { padding: 10px 6px; }
      .grid { gap: 0; }
      .day-cell { aspect-ratio: auto; min-height: 46px; }
      .neto-value { font-size: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

    const vibrate = (ms) => {

    // ============================================================

    const DEFAULT_CONFIG = {

    const state = {
      year: new Date().getFullYear(), month: new Date().getMonth(),

      allData: {},

    // Privacy is a preference of this device, never an incoming cloud choice.
    const MONEY_KEY = 'horas-hide-money';
    let privateGeneration=0;
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cloudConfig = () => { const c={...state.config}; delete c.hideMoney; return c; };

      state.config.hideMoney=!state.config.hideMoney;
      // Discard in-flight or previously displayed AI results when privacy changes.
      discardAI();if(state.config.hideMoney)clearReportPrivate();render();

    const periodConfig = (y=state.year,m=state.month) => C.cfgFor(state.allData,state.config,y,m);

    let privacy = localStorage.getItem('horas-hide-money');
    const legacy = localStorage.getItem('horas-app-v2');
    if(privacy===null && legacy) {try {privacy=JSON.parse(legacy).config?.hideMoney?'1':'0';} catch {}}
    state.config.hideMoney=privacy==='1';
    const saveState = () => {try {C.freezeDerivedPeriods(state.allData,state.config);sync.save();return true;} catch(e) {alert(e.message);return false;}};
    function ensurePeriod() {
      const mk=monthKey(state.year,state.month);
      if(!state.allData[mk])state.allData[mk]={days:{},rateConfig:C.financial(state.config),historicalStatus:'confirmed'};
      return state.allData[mk];
    }

    // ============================================================
    const firebaseConfig = {

      authDomain: "mishoras-bb0cc.firebaseapp.com",
      projectId: "mishoras-bb0cc",
      storageBucket: "mishoras-bb0cc.firebasestorage.app",
      messagingSenderId: "282064047722",
      appId: "1:282064047722:web:24a04aabeecb4a67394413"
    };

    function hoursColor(h) {
      if (h < 9.5) return "#E8EDF7";
      const t = Math.min(1, (h - 9.5) / 2.5);
      const a = [255, 176, 79], b = [255, 128, 128];
      const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    function getEntry(allData, date) {
      const rec = allData[monthKey(date.getFullYear(), date.getMonth())];
      return rec?.days?.[date.getDate()] || null;
    }

    // Info de la semana (lunes a domingo) que contiene una fecha dada
    function calcWeekInfo(date) {
      const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - ((date.getDay() + 6) % 7));
      const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
      let hNormal = 0, hFestivo = 0, dias = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const e = getEntry(state.allData, d);
        if (!e || e.type === "descanso") continue;
        const h = Number(e.hours) || 0;
        if (h > 0) dias++;
        if (e.type === "festivo") hFestivo += h; else hNormal += h;
      }
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const isCurrent = today >= monday && today <= sunday;
      return { monday, sunday, hNormal, hFestivo, total: hNormal + hFestivo, dias, isCurrent, isClosed: sunday < today };
    }

    const fmtDia = (d) => `${d.getDate()} ${MESES_CORTO[d.getMonth()].toLowerCase()}`;

    const calcExtraMap=(data,y,m)=>C.extraMap(data,y,m);
    const calcExtraInfo=(data,y,m)=>C.extraInfo(data,state.config,y,m);

    function calcProjection(monthData, calcResult, config, year, month, daysInMonth) {
      const today = new Date();
      if (month !== today.getMonth() || year !== today.getFullYear()) return null;
      
      const elapsed = today.getDate();
      const remaining = Array.from({length:daysInMonth-elapsed},(_,i)=>elapsed+i+1).filter(d=>!monthData[d]).length;
      if (remaining <= 0) return null;

      let workedH = 0, workedDays = 0;
      for (let d = 1; d <= elapsed; d++) {
        const e = monthData[d];
        if (!e || e.type === "descanso") continue;
        const h = Number(e.hours) || 0;
        if (h > 0) { workedDays++; workedH += h; }
      }
      
      if (workedDays < 3) return null;
      
      const avgH = workedH / workedDays;
      const projWorkDays = remaining * (workedDays / elapsed); 
      const projExtraH = projWorkDays * avgH;
      const projBruto = calcResult.bruto + projExtraH * config.rateNormal;
      const projDed = config.deductions.reduce((s, d) => s + (projBruto * d.pct) / 100, 0);
      
      return { projBruto, projNeto: projBruto - projDed, avgH, remaining };
    }

    function getAnnualData() {
      const rows = [];

        const k = monthKey(state.year, m);

      }
      return rows;
    }

    // ============================================================
    // GENERADOR PDF NATIVO VANILLA JS + DESCARGA BASE64

    const eurPdf = (n) => (n || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    
    const BS = String.fromCharCode(92);
    
    function pdfEsc(s) {
      let out = "";
      for (const ch of String(s)) {
        const c = ch.codePointAt(0);
        if (c === 0x20AC) out += String.fromCharCode(128); else if (c === 0x2014 || c === 0x2013) out += "-";
        else if (c === 0x00B7) out += String.fromCharCode(183); else if (c > 255) out += "?"; else out += ch;
      }
      return out.split(BS).join(BS+BS).split("(").join(BS+"(").split(")").join(BS+")");
    }

    function createPdfDoc() {
      const pages = [[]]; let y = 786;
      const cur = () => pages[pages.length - 1];
      const addPage = () => { pages.push([]); y = 786; };
      const need = (h) => { if (y - h < 56) {addPage();return true;}return false; };
      const txt = (x, s, o = {}) => {
        const size = o.size || 10; const tx = o.right ? x - (String(s).length * size * 0.5) : x;
        const col = o.color || (o.gray ? "0.45 0.48 0.55" : "0.08 0.1 0.14");
        cur().push(`BT /${o.bold ? "F2" : "F1"} ${size} Tf ${col} rg 1 0 0 1 ${tx.toFixed(1)} ${y.toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
      };
      const hr = () => { cur().push(`0.8 0.82 0.86 RG 0.6 w 40 ${(y + 3).toFixed(1)} m 555 ${(y + 3).toFixed(1)} l S`); };
      const down = (h) => { y -= h; };
      return { pages, txt, hr, down, need, addPage };
    }

    function assemblePdf(pages) {
      let out = "%PDF-1.4\n"; const offsets = []; const push = (s) => { offsets.push(out.length); out += s; };
      const n = pages.length; const kids = pages.map((_, i) => `${5 + i * 2} 0 R`).join(" ");
      push(`1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n`);
      push(`2 0 obj << /Type /Pages /Kids [${kids}] /Count ${n} >> endobj\n`);
      push(`3 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >> endobj\n`);
      push(`4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >> endobj\n`);
      pages.forEach((opsArr, i) => {
        const content = [`BT /F2 9 Tf 0.25 0.28 0.32 rg 1 0 0 1 40 815 Tm (Mis Horas - Informe) Tj ET`,...opsArr,`BT /F1 9 Tf 0.25 0.28 0.32 rg 1 0 0 1 40 28 Tm (${pdfEsc("Página "+(i+1)+" de "+n)}) Tj ET`].join("\n");
        push(`${5 + i * 2} 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >> endobj\n`);
        push(`${6 + i * 2} 0 obj << /Length ${content.length} >> stream\n${content}\nendstream endobj\n`);
      });
      const xrefPos = out.length; const total = 5 + n * 2;
      out += `xref\n0 ${total}\n0000000000 65535 f \n`;
      offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
      out += `trailer << /Size ${total} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
      return out;
    }

    function buildMonthReport(doc,yy,mm,includeEconomic=true) {

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function processDownload(blob, filename) {
      try {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename }); return;
        }
      } catch(e) {}
      
      try {
        const base64 = await blobToBase64(blob);
        const a = document.createElement("a");
        a.href = base64;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => document.body.removeChild(a), 500);
      } catch(err) {
        alert("No se pudo descargar el archivo.");
      }
    }

      }

      app.innerHTML = renderTabs + content + `
        <p id="local-status" class="privacy-note" role="status" style="text-align:center;color:${cloud.status==='error'?'var(--danger)':'var(--muted)'}">${esc(cloud.errorMsg||'Guardado en este dispositivo')}</p><div class="watermark">
          &copy; ${new Date().getFullYear()} Propiedad de FranOlea. Todos los derechos reservados.
        </div>
      `;
      const pane=app.querySelector('.tab-content');if(pane){pane.id='tab-panel';pane.setAttribute('aria-labelledby','nav-'+state.tab);}if(pane&&state.tab!==lastRenderedTab)pane.classList.add('tab-enter');lastRenderedTab=state.tab;
      app.querySelectorAll('input,select').forEach((el,i)=>{if(!el.id)el.id='field-'+i;if(!el.hasAttribute('aria-label')&&!el.labels?.length)el.setAttribute('aria-label',el.closest('.row')?.querySelector('span')?.textContent||el.placeholder||'Ajuste');});
      app.querySelectorAll('.tab-btn').forEach(el=>el.setAttribute('aria-current',el.classList.contains('active')?'page':'false'));
      if(focusId)document.getElementById(focusId)?.focus({preventScroll:true});
      renderModalExport();
      
      if (state.tab === "mes") {
        renderCalendarGrid();
        renderEditor();
      }
      
      if (state.tab === "ia") {
        const scrollBox = getEl("chat-scroll-box");
        if (scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;
      }
    }

    // ============================================================
    // EVENTOS Y NAVEGACIÓN MODULAR
    // ============================================================
    window.navMonth = (dir) => { 
      vibrate(20);
      state.month += dir; state.selectedDay = null;
      if (state.month < 0) { state.month = 11; state.year--; }
      if (state.month > 11) { state.month = 0; state.year++; }
      render(); 
    };
    
    window.selectDay = (d) => {
      vibrate(20);
      state.selectedDay = state.selectedDay === d ? null : d;
      const mk = monthKey(state.year, state.month);
      const ex = (state.allData[mk]?.days || {})[state.selectedDay];
      state.draft = ex ? C.copy(ex) : { type: "normal", hours: 8 };
      state.dayConfirmed = !!ex;
      
      renderCalendarGrid();
      renderEditor();
    };

    window.updateDraftType = (type) => {
      vibrate(20);
      state.draft.type = type;
      if (type === 'descanso') {state.draft.hours=0;state.draft.extraHours=null;state.draft.nightHours=null;}
      state.dayConfirmed = false;
      renderEditor();
    };

    window.stepHours = (diff, val) => {
      vibrate(20);
      let current = Number(state.draft.hours) || 0;
      let h = val !== undefined ? Number(val) : current + diff;
      h = Math.max(0, Math.min(24, h));
      
      state.draft.hours = h;
      state.dayConfirmed = false;

      const inp = getEl('draft-hours');
      if (inp) {
        if (val === undefined) inp.value = h;
        inp.style.color = hoursColor(h);
      }

      const addBtn = getEl('btn-add-day');
      if (addBtn) addBtn.style.display = 'block';

      const earnBox = getEl('day-earn-box');
      if (earnBox) earnBox.style.display = 'none';
    };

    window.saveDay = () => {
      const previousNet=monthly().neto;
      vibrate(100);
      const mk = monthKey(state.year, state.month);
      if(!state.selectedDay||!state.draft||!Number.isFinite(state.draft.hours)||state.draft.hours<0||state.draft.hours>24){alert('Horas no válidas.');return;}
      try{C.validateDay(state.draft);}catch(e){alert(e.message);return;}
      ensurePeriod();
      state.allData[mk].days[state.selectedDay] = C.copy(state.draft);
      if(!saveState())return;
      state.dayConfirmed = true;
      render();animateNetChange(previousNet); 
    };
    
    window.clearDay = () => {
      const previousNet=monthly().neto;
      vibrate(20);
      const mk = monthKey(state.year, state.month);
      if(state.allData[mk] && state.allData[mk].days) state.allData[mk].days[state.selectedDay]=null;
      if(!saveState())return;
      state.selectedDay = null; render();animateNetChange(previousNet);
    }

    function setConfig(next) {
      try{const validated=C.config(next,DEFAULT_CONFIG);C.freezeDerivedPeriods(state.allData,state.config);state.config=validated;saveState();render();}catch(e){alert(e.message);render();}
    }
    window.updateConfig=(k,v)=>{
      if(!['rateNormal','plusFestivo','rateExtra','profile','userName'].includes(k))return;
      const next=C.copy(state.config);next[k]=['profile','userName'].includes(k)?v:(String(v).trim()===''?NaN:Number(v));
      if(k==='profile'&&v!=='sintax')next.sintaxUnlocked=false;setConfig(next);
    };
    window.updateDed=(i,k,v)=>{const next=C.copy(state.config);if(!next.deductions[i]||!['pct','name'].includes(k))return;next.deductions[i][k]=k==='pct'?(String(v).trim()===''?NaN:Number(v)):v;setConfig(next);};
    window.delDed=i=>{const next=C.copy(state.config);next.deductions.splice(i,1);setConfig(next);};
    window.addDed=()=>{const next=C.copy(state.config);next.deductions.push({id:crypto.randomUUID(),name:'Nueva',pct:0});setConfig(next);};
    window.unlockSintax=()=>{if(getEl('pw-sintax').value==='Sintax_Granada')setConfig({...state.config,sintaxUnlocked:true});else alert('Contraseña incorrecta.');};
    window.confirmPeriodRates=()=>{
      if(!confirm('Se cambiarán los cálculos de '+MESES[state.month]+' '+state.year+' con las tarifas, perfil y retenciones actuales. Se guardará una copia recuperable.'))return;
      try{sync.recover('Antes de corregir tarifas del periodo');const rec=ensurePeriod();rec.rateConfig=C.financial(state.config);rec.historicalStatus='confirmed';saveState();render();}catch(e){alert(e.message);}
    };
    window.toggleClosed=()=>{ensurePeriod().closed=!ensurePeriod().closed;saveState();render();};
    window.exportMaster=async()=>{try{if(cloud.user)await sync.ensureHistory();const text=await masterHistory.exportJSON();await processDownload(new Blob([text],{type:'application/json'}),'MisHoras_Historial_Maestro_'+new Date().toISOString().slice(0,10)+'.json');}catch(e){alert(e.message||'No se pudo recuperar el archivo maestro.');}};
    window.exportBackup=()=>processDownload(new Blob([JSON.stringify({...payload(),config:{...state.config}})],{type:'application/json'}),`Backup_Horas_${new Date().toISOString().slice(0,10)}.json`);
    function replaceFromBackup(p,reason='Importar copia') {
      p=C.validateBackup(p,DEFAULT_CONFIG);
      if(!confirm(`${reason}: se reemplazarán los registros y ajustes de esta copia local (${Object.keys(state.allData).length} meses) por ${Object.keys(p.data).length} meses. Los borrados se sincronizarán en esta cuenta. Se conservará una recuperación previa. La preferencia de ocultar importes no cambia.`))return;
      sync.recover('Antes de importar');
      for(const [mk,old] of Object.entries(state.allData)) {
        if(!p.data[mk])p.data[mk]={...C.copy(old),days:{},payroll:C.emptyPayroll()};
        for(const d of Object.keys(old.days))if(!(d in p.data[mk].days))p.data[mk].days[d]=null;
         const oldPayroll=old.payroll||{},nextPayroll=p.data[mk].payroll||C.emptyPayroll();
         for(const col of ['incomes','deductions'])for(const id of Object.keys(oldPayroll[col]||{}))if(!Object.hasOwn(nextPayroll[col],id))nextPayroll[col][id]=null;
         if(old.payroll||p.data[mk].payroll)p.data[mk].payroll=nextPayroll;
      }
      const hidden=state.config.hideMoney;state.config={...p.config,hideMoney:hidden};state.allData=p.data;if(!saveState()){render();return;}state.selectedDay=null;discardAI();clearReportPrivate();render();
    }
    window.importBackup=async(e)=>{
      const file=e.target.files[0],session=sync.session();e.target.value='';if(!file)return;
      try{if(file.size>5*1024*1024)throw Error('Copia demasiado grande (máximo 5 MB).');const text=await file.text();if(session!==sync.session())return;const p=C.validateBackup(JSON.parse(text),DEFAULT_CONFIG);replaceFromBackup(p);}
      catch(e){if(session===sync.session())alert('Copia rechazada. Los datos existentes no se han alterado. '+e.message);}
    };
    window.restoreRecovery=()=>{
      try{const raw=sync.recovery();if(!raw){alert('No hay recuperación para esta cuenta.');return;}const list=JSON.parse(raw);replaceFromBackup(list.at(-1).payload,'Restaurar la última copia previa ('+list.at(-1).at+')');}catch(e){alert(e.message);}
    };
    window.renderChart = () => {
      const ctx = getEl('chart-anual'); if(!ctx) return;
      if(chartInst) chartInst.destroy();
      if(typeof Chart==='undefined'){const note=document.createElement('p');note.className='privacy-note';note.textContent='Gráfico no disponible. Puedes consultar las cifras del resumen.';ctx.replaceWith(note);return;}
      const rows = getAnnualData();
      chartInst = new Chart(ctx, {
        type: 'bar',
        data: { labels: rows.map(r=>r.name), datasets: [{ label: state.config.hideMoney?'Horas':'Neto estimado', data: rows.map(r=>state.config.hideMoney?r.horas:r.neto), backgroundColor: '#4FA3FF', borderRadius: 4 }] },
        options: { animation:matchMedia('(prefers-reduced-motion: reduce)').matches?false:{duration:180}, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display:true,ticks:{color:'#AFB8CC'}, grid: { color: '#2A3247' } }, x: { ticks:{color:'#AFB8CC'},grid: { display: false } } } }
      });
    };

    window.openExportModal = () => { vibrate(20); state.pdfReady = null; getEl('modal-export').style.display = 'flex'; renderModalExport(); };
    window.closeExport = () => { vibrate(20); getEl('modal-export').style.display = 'none'; };
    window.renderModalExport = () => {
      const m = getEl('modal-export-content'); if(!m) return;
      if (!state.pdfReady) {
        m.innerHTML = `
          <div style="font-family:'Space Grotesk', system-ui; font-weight:700; font-size:17px; margin-bottom:14px">Exportar PDF</div><p class="privacy-note">Elige si el PDF incluye información económica. Los datos reales y las estimaciones se identifican por separado.</p>
          <label class="report-choice"><input type="checkbox" ${state.reportEconomy?'checked':''} onchange="state.reportEconomy=this.checked;state.pdfReady=null">Incluir información económica</label><p class="privacy-note">Si la activas, el PDF contiene datos económicos aunque estén ocultos en pantalla.</p><button class="big-btn" onclick="closeExport();openHistory()">Elegir cualquier mes en Histórico</button><button class="big-btn" style="border-color:var(--accent); color:var(--accent); margin-bottom:16px" onclick="doExportMonth()">📄 Este mes · ${MESES[state.month]} ${state.year}</button>
          <div style="color:var(--muted); font-size:11px; font-weight:600; margin-bottom:8px">O AÑO COMPLETO</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            ${[state.year, state.year-1].map(y => `<button class="big-btn" style="flex:1 0 45%; padding:10px 0" onclick="doExportYear(${y})">🗓 ${y}</button>`).join('')}
          </div>
          <button style="width:100%; text-align:center; color:var(--muted); margin-top:16px; font-size:13px" onclick="closeExport()">Cancelar</button>
        `;
      } else {
        m.innerHTML = `
          <div style="font-family:'Space Grotesk', system-ui; font-weight:700; font-size:17px; margin-bottom:14px; color:var(--success)">✓ PDF Generado</div>
          <p style="color:var(--text); font-size:13px; word-break:break-all; margin-bottom:16px">${esc(state.pdfReady.filename)}</p>
          <button class="big-btn" style="border-color:var(--success); color:var(--success); margin-bottom:8px" onclick="processDownload(state.pdfReady.blob, state.pdfReady.filename)">⬇ Descargar / Compartir</button>
          <button style="width:100%; text-align:center; color:var(--muted); margin-top:8px; font-size:13px" onclick="closeExport()">Cerrar</button>
        `;
      }
    };

    const moneyPreference=localStorage.getItem(MONEY_KEY);
    if(moneyPreference!==null)state.config.hideMoney=moneyPreference==='1';
    localStorage.setItem(MONEY_KEY,state.config.hideMoney?'1':'0');
    try{sync.load();}catch(e){alert(e.message);}
    sync.setOnline(navigator.onLine!==false);
    render();initCloud();
    import('./ai-config.js?v=11').then(({aiConfig})=>{state.aiEnabled=aiConfig.enabled===true;render();}).catch(()=>{});
    document.addEventListener('DOMContentLoaded',()=>{if(!cloud.ready)initCloud();if(state.tab==='anual')render();});

    // ============================================================
    // PWA: REGISTRO DEL SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn("SW no registrado:", e));
    }
  </script>
</body>
</html>
