<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11151F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Control de Horas</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./ai-data.js"></script>
  

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    
    :root {
      --bg: #11151F; --card: #171C2A; --text: #E8EDF7; --muted: #AFB8CC;
      --border: #2A3247; --border-light: #1E2434;
      --accent: #4FA3FF; --success: #7BE8A8; --warning: #FFB04F; --danger: #FF8B8B;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    input, select { font-family: inherit; outline: none; }
    
    .app-root { max-width: 640px; margin: 0 auto; padding: 12px 14px 12px; display: flex; flex-direction: column; flex: 1; width: 100%; }
    
    .tabs-bar { display: flex; gap: 6px; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 4px; margin-bottom: 14px; flex: 0 0 auto;}
    .tab-btn { flex: 1; padding: 9px 0; border-radius: 11px; color: var(--muted); font-size: 14px; font-weight: 600; transition: all 0.15s; }
    .tab-btn.active { background: var(--border-light); color: var(--text); }
    .eye-btn { width: 42px; border-radius: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
    .eye-btn.active { background: rgba(255,176,79,0.12); color: var(--warning); }
    
    .tab-content { flex: 1; display: flex; flex-direction: column;  }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .two-col, .ajustes-grid { display: block; }
    
    .card { background: var(--card); border: 1px solid var(--border-light); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .big-btn { width: 100%; padding: 12px 10px; border-radius: 14px; border: 1.5px solid var(--border); background: rgba(255,255,255,0.03); color: #C9D2E3; font-size: 14px; font-weight: 600; text-align: center; }
    .config-input { width: 90px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
    
    .neto-block { text-align: center; padding: 18px 12px; border-radius: 16px; background: linear-gradient(160deg, rgba(79,163,255,0.1), rgba(123,232,168,0.07)); border: 1px solid var(--border); margin-bottom: 14px;}
    .neto-value { font-family: 'Space Grotesk', system-ui; font-weight: 700; font-size: 38px; color: var(--success); margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px; }
    .day-cell { min-height: 46px; aspect-ratio: 1; border-radius: 10px; border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); padding:0; transition: border-color 0.15s; }
    .day-cell.today { border-color: var(--accent); }
    .day-cell span:first-child { font-size: 13px; font-weight: 600; }
    .day-cell span + span { font-size: 11px; }
    
    .editor { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .type-btn { flex: 1; padding: 10px 0; border-radius: 12px; border: 1.5px solid var(--border); font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); }
    .hours-input { width: 80px; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 20px; font-weight: 700; text-align: center; font-family: 'Space Grotesk', system-ui; }
    .step-btn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 22px; }
    .add-btn { width: 100%; padding: 13px 0; border-radius: 14px; background: linear-gradient(100deg, #3FD68C, #7BE8A8); color: #0E1420; font-size: 15px; font-weight: 700; font-family: 'Space Grotesk', system-ui; }
    .day-earn-box { text-align: center; padding: 14px 12px; border-radius: 14px; background: linear-gradient(160deg, rgba(123,232,168,0.08), rgba(63,214,140,0.03)); border: 1px solid rgba(123,232,168,0.2); }

    .week-banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: linear-gradient(160deg, rgba(79,163,255,0.10), rgba(79,163,255,0.03)); border: 1px solid var(--border);  }
    
    .bubble { max-width: 85%; border-radius: 14px; border: 1px solid; padding: 9px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { background: rgba(79,163,255,0.18); border-color: rgba(79,163,255,0.35); margin-left: auto; color: var(--text); }
    .bubble.bot { background: var(--border-light); border-color: var(--border); margin-right: auto; color: var(--text); }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(8,10,16,0.72); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
    
    .watermark { text-align: center; padding: 20px 0 10px; color: #AFB8CC; font-size: 11px; letter-spacing: 0.5px; opacity: 1; font-family: 'Space Grotesk', system-ui; text-transform: uppercase; font-weight: 600; margin-top: auto; }

    @media (min-width: 840px) and (min-height: 540px) {
      .app-root { max-width: 1240px; height: 100vh; overflow: hidden; padding-bottom: 0; }
      .tabs-bar { max-width: 620px; width: 100%; margin: 0 auto 14px auto; }
      .tab-content { overflow: hidden; }
      .two-col, .ajustes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; height: 100%; min-height: 0; align-items: stretch; }
      .col-scroll { overflow-y: auto; height: 100%; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .col-scroll::-webkit-scrollbar { width: 6px; }
      .col-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      .ia-wrap { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; width: 100%; }
      .watermark { padding: 10px 0; }
    }
    button, input, select { min-height: 44px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    input, select, textarea { font-size: 16px; }
    .big-btn { min-width: 44px; }
    .eye-btn { min-width: 44px; }
    .row { gap: 8px; flex-wrap: wrap; }
    .row > span, .col-scroll, .card, .neto-block { min-width: 0; }
    .card, .neto-block { overflow-wrap: anywhere; }
    .config-input { min-width: 0; max-width: 100%; }
    .day-cell span { line-height: 1.4; }
    .calendar-legend { display: flex; gap: 18px; margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .calendar-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
    .tab-enter { animation: fadeIn 180ms ease-out; }
    .money-detail { font-size: 14px; color: var(--text); line-height: 1.6; }
    .hours-total { font-size: 19px; font-weight: 700; margin-top: 8px; }
    .privacy-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
    button:disabled { opacity: .65; cursor: default; }
    .modal { max-height: 90dvh; overflow-y: auto; }
    @media (max-width: 360px) {
      .app-root { padding: 10px 6px; }
      .grid { gap: 0; }
      .day-cell { aspect-ratio: auto; min-height: 46px; }
      .neto-value { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <div id="app" class="app-root"></div>
  
  <div id="modal-export" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Exportar PDF" onclick="closeExport()">
    <div class="modal" onclick="event.stopPropagation()" id="modal-export-content"></div>
  </div>

  <input type="file" id="nomina-upload" accept="application/pdf" style="display:none" onchange="handleNominaUpload(event)">
  <input type="file" id="backup-upload" accept="application/json,.json" style="display:none" onchange="importBackup(event)">

  <script>
    // ============================================================
    // MOTOR DE VIBRACIÓN HÁPTICA
    // ============================================================
    const vibrate = (ms) => {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    };

    // ============================================================
    // ESTADO GLOBAL Y CONFIGURACIÓN
    // ============================================================
    const DEFAULT_CONFIG = {
      userName: "",
      rateNormal: 9.6696, plusFestivo: 7.25, profile: "ett", sintaxUnlocked: false, rateExtra: 0, hideMoney: false,
      deductions: [
        { id: "d1", name: "Retención IRPF", pct: 2.0 },
        { id: "d2", name: "Contingencias comunes", pct: 4.7 },
        { id: "d3", name: "Desempleo", pct: 1.6 },
        { id: "d4", name: "Formación profesional", pct: 0.1 },
        { id: "d5", name: "MEI", pct: 0.15 },
      ]
    };

    const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const MESES_CORTO = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const DIAS_SEMANA = ["L","M","X","J","V","S","D"];
    const TYPES = {
      normal:   { label: "Normal",   color: "#4FA3FF", bg: "rgba(79,163,255,0.18)" },
      festivo:  { label: "Festivo",  color: "#FFB04F", bg: "rgba(255,176,79,0.20)" },
      descanso: { label: "Descanso", color: "#C1CADB", bg: "rgba(193,202,219,0.20)" },
    };

    const state = {
      year: new Date().getFullYear(), month: new Date().getMonth(),
      config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
      allData: {},
      tab: "mes", selectedDay: null, draft: null, dayConfirmed: false,
      chatMsgs: [], chatInput: "", chatLoading: false,
      nomina: { status: "idle", result: null, error: null },
      pdfReady: null
    };

    // Privacy is a preference of this device, never an incoming cloud choice.
    const MONEY_KEY = 'horas-hide-money';
    let privateGeneration=0;
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const cloudConfig = () => { const c={...state.config}; delete c.hideMoney; return c; };
    window.toggleMoney = () => {
      state.config.hideMoney=!state.config.hideMoney;
      localStorage.setItem(MONEY_KEY,state.config.hideMoney?'1':'0');
      // Discard in-flight or previously displayed AI results when privacy changes.
      discardAI();render();
    };
    const eur = (n) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(n || 0);
    const fmt = (n) => state.config.hideMoney ? "•••• €" : eur(n);
    const fmtH = (n) => String(Math.round((Number(n) || 0) * 100) / 100).replace(".", ",");
    const monthKey = (y, m) => `${y}-${String(m + 1).padStart(2, "0")}`;
    const extraActive = (cfg) => cfg.profile === "sintax" && cfg.sintaxUnlocked;
    const saveState = () => { localStorage.setItem("horas-app-v2", JSON.stringify({ config: state.config, data: state.allData })); cloudSave(); };

    // ============================================================
    // NUBE: FIREBASE (LOGIN GOOGLE + FIRESTORE)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBkQ4NcoxU0V_R3jXnkH5Eu9WRDpr9eKXo",
      authDomain: "mishoras-bb0cc.firebaseapp.com",
      projectId: "mishoras-bb0cc",
      storageBucket: "mishoras-bb0cc.firebasestorage.app",
      messagingSenderId: "282064047722",
      appId: "1:282064047722:web:24a04aabeecb4a67394413"
    };

    const cloud = { ready: false, user: null, status: "off", unsub: null, applyingRemote: false, saveTimer: null, synced: false, errorMsg: "" };

    try {
      firebase.initializeApp(firebaseConfig);
      cloud.db = firebase.firestore();
      cloud.ready = true;
    } catch (e) { console.error("Firebase no disponible:", e); }

    function userDocRef() { return cloud.db.collection("users").doc(cloud.user.uid); }

    // Fusiona datos locales y remotos (unión de meses y días; en conflicto gana lo local)
    function mergeData(remoteData, localData) {
      const out = JSON.parse(JSON.stringify(remoteData || {}));
      for (const mk of Object.keys(localData || {})) {
        if (!out[mk]) { out[mk] = JSON.parse(JSON.stringify(localData[mk])); continue; }
        out[mk].days = { ...(out[mk].days || {}), ...(localData[mk].days || {}) };
      }
      return out;
    }

    function applyRemote(p) {
      cloud.applyingRemote = true;
      state.config = { ...DEFAULT_CONFIG, ...(p.config || {}), hideMoney:state.config.hideMoney };
      state.allData = p.data || {};
      localStorage.setItem("horas-app-v2", JSON.stringify({ config: state.config, data: state.allData }));
      cloud.applyingRemote = false;
      render();
    }

    function cloudSave() {
      if (!cloud.ready || !cloud.user || cloud.applyingRemote || !cloud.synced) return;
      cloud.status = "syncing";
      clearTimeout(cloud.saveTimer);
      cloud.saveTimer = setTimeout(() => {
        userDocRef().set({ config: cloudConfig(), data: state.allData, updatedAt: Date.now() })
          .then(() => { cloud.status = "ok"; const el = document.getElementById("cloud-status"); if (el) el.textContent = "☁️ Sincronizado"; })
          .catch((e) => { console.error(e); cloud.status = "error"; cloud.errorMsg = e.message || String(e); const el = document.getElementById("cloud-status"); if (el) el.textContent = "⚠️ Error al sincronizar"; });
      }, 800);
    }

    async function startSync(user) {
      if(cloud.user?.uid!==user.uid){discardAI();}
      cloud.user = user;
      cloud.status = "syncing";
      cloud.errorMsg = "";
      render();
      try {
        const snap = await userDocRef().get();
        if (snap.exists) {
          const remote = snap.data();
          const merged = mergeData(remote.data, state.allData);
          state.config = { ...DEFAULT_CONFIG, ...(remote.config || {}), ...( // conserva config local si el remoto está vacío
            Object.keys(remote.config || {}).length ? {} : state.config),hideMoney:state.config.hideMoney };
          state.allData = merged;
          localStorage.setItem("horas-app-v2", JSON.stringify({ config: state.config, data: state.allData }));
          await userDocRef().set({ config: cloudConfig(), data: state.allData, updatedAt: Date.now() });
        } else {
          await userDocRef().set({ config: cloudConfig(), data: state.allData, updatedAt: Date.now() });
        }
        cloud.status = "ok";
        cloud.synced = true;
        // Escucha cambios en tiempo real desde otros dispositivos
        cloud.unsub = userDocRef().onSnapshot((doc) => {
          if (!doc.exists || doc.metadata.hasPendingWrites) return;
          applyRemote(doc.data());
        });
      } catch (e) {
        console.error(e);
        cloud.status = "error";
        cloud.errorMsg = e.message || String(e);
      }
      render();
    }

    // Descarga forzada: trae lo que hay en la nube y sobrescribe lo local
    window.forceCloudPull = async () => {
      vibrate(20);
      if (!cloud.ready || !cloud.user) { alert("Inicia sesión primero."); return; }
      if (!confirm("Se descargarán los datos de la nube y sustituirán a los de este dispositivo. ¿Continuar?")) return;
      cloud.status = "syncing";
      render();
      try {
        const snap = await userDocRef().get();
        if (!snap.exists) { alert("No hay datos guardados en la nube todavía."); cloud.status = "ok"; render(); return; }
        applyRemote(snap.data());
        cloud.status = "ok";
        cloud.synced = true;
        alert("✓ Datos descargados de la nube.");
      } catch (e) {
        cloud.status = "error";
        cloud.errorMsg = e.message || String(e);
        alert("Error al descargar: " + cloud.errorMsg);
      }
      render();
    };

    window.loginGoogle = async () => {
      vibrate(20);
      if (!cloud.ready) { alert("Firebase no está disponible. Revisa tu conexión."); return; }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await firebase.auth().signInWithPopup(provider);
      } catch (e) {
        // Fallback para navegadores que bloquean el popup
        if (e.code === "auth/popup-blocked" || e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") {
          try { await firebase.auth().signInWithRedirect(provider); } catch (e2) { alert("No se pudo iniciar sesión: " + e2.message); }
        } else {
          alert("No se pudo iniciar sesión: " + e.message);
        }
      }
    };

    window.logoutGoogle = async () => {
      vibrate(20);
      if (cloud.unsub) { cloud.unsub(); cloud.unsub = null; }
      discardAI();
      cloud.user = null; cloud.status = "off"; cloud.synced = false;
      try { await firebase.auth().signOut(); } catch (e) {}
      render();
    };

    if (cloud.ready) {
      firebase.auth().getRedirectResult().catch(() => {});
      firebase.auth().onAuthStateChanged((user) => {
        if (user) { startSync(user); }
        else { discardAI(); if (cloud.unsub) { cloud.unsub(); cloud.unsub = null; } cloud.user = null; cloud.status = "off"; cloud.synced = false; render(); }
      });
    }

    function hoursColor(h) {
      if (h < 9.5) return "#E8EDF7";
      const t = Math.min(1, (h - 9.5) / 2.5);
      const a = [255, 176, 79], b = [255, 128, 128];
      const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    // ============================================================
    // LÓGICA DE NEGOCIO Y CÁLCULOS
    // ============================================================
    function getEntry(allData, date) {
      const rec = allData[monthKey(date.getFullYear(), date.getMonth())];
      return rec?.days?.[date.getDate()] || null;
    }

    // Info de la semana (lunes a domingo) que contiene una fecha dada
    function calcWeekInfo(date) {
      const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - ((date.getDay() + 6) % 7));
      const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
      let hNormal = 0, hFestivo = 0, dias = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const e = getEntry(state.allData, d);
        if (!e || e.type === "descanso") continue;
        const h = Number(e.hours) || 0;
        if (h > 0) dias++;
        if (e.type === "festivo") hFestivo += h; else hNormal += h;
      }
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const isCurrent = today >= monday && today <= sunday;
      return { monday, sunday, hNormal, hFestivo, total: hNormal + hFestivo, dias, isCurrent, isClosed: sunday < today };
    }

    const fmtDia = (d) => `${d.getDate()} ${MESES_CORTO[d.getMonth()].toLowerCase()}`;

    function calcExtraMap(allData, year, month, daysInMonth) {
      const extraMap = {};
      const first = new Date(year, month, 1);
      let monday = new Date(year, month, 1 - ((first.getDay() + 6) % 7));
      const monthEnd = new Date(year, month, daysInMonth);
      while (monday <= monthEnd) {
        const week = []; let totalH = 0;
        for (let i = 0; i < 7; i++) {
          const date = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
          const e = getEntry(allData, date);
          const h = e && e.type !== "descanso" ? Number(e.hours) || 0 : 0;
          totalH += h; week.push({ date, e, h });
        }
        let extra = Math.max(0, totalH - 40);
        if (extra > 0) {
          for (let i = 6; i >= 0 && extra > 0; i--) {
            const { date, e, h } = week[i];
            if (!e || e.type !== "normal" || h <= 0) continue;
            const take = Math.min(h, extra); extra -= take;
            if (date.getFullYear() === year && date.getMonth() === month) {
              extraMap[date.getDate()] = (extraMap[date.getDate()] || 0) + take;
            }
          }
        }
        monday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7);
      }
      return extraMap;
    }

    function calcExtraInfo(allData, year, month, daysInMonth) {
      const genMap = calcExtraMap(allData, year, month, daysInMonth);
      const prevDate = new Date(year, month - 1, 1);
      const prevDim = new Date(prevDate.getFullYear(), prevDate.getMonth() + 1, 0).getDate();
      const prevMap = calcExtraMap(allData, prevDate.getFullYear(), prevDate.getMonth(), prevDim);
      const sum = (m) => Object.values(m).reduce((s, h) => s + h, 0);
      return { hGen: sum(genMap), hPrev: sum(prevMap) };
    }

    function calcMonth(days, config, daysInMonth, extraInfo = null) {
      let hNormal = 0, hFestivo = 0, diasTrab = 0, diasDesc = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const e = days?.[d];
        if (!e) continue;
        if (e.type === "descanso") { diasDesc++; continue; }
        const h = Number(e.hours) || 0;
        if (h > 0) diasTrab++;
        if (e.type === "festivo") hFestivo += h; else hNormal += h;
      }
      const useExtra = extraInfo && extraActive(config);
      const hExtraGen = useExtra ? extraInfo.hGen : 0;
      const hExtra = useExtra ? extraInfo.hPrev : 0;
      const hNormalPaid = hNormal - hExtraGen;
      const brutoNormal = hNormalPaid * config.rateNormal;
      const brutoExtra = hExtra * config.rateExtra;
      const brutoFestivo = hFestivo * (config.rateNormal + config.plusFestivo);
      const bruto = brutoNormal + brutoFestivo + brutoExtra;
      const dets = config.deductions.map((d) => ({ ...d, amount: (bruto * d.pct) / 100 }));
      const totalDed = dets.reduce((s, d) => s + d.amount, 0);
      return { hNormal, hNormalPaid, hFestivo, hExtra, hExtraGen, diasTrab, diasDesc, bruto, brutoNormal, brutoFestivo, brutoExtra, dets, totalDed, neto: bruto - totalDed };
    }

    function calcProjection(monthData, calcResult, config, year, month, daysInMonth) {
      const today = new Date();
      if (month !== today.getMonth() || year !== today.getFullYear()) return null;
      
      const elapsed = today.getDate();
      const remaining = daysInMonth - elapsed;
      if (remaining <= 0) return null;

      let workedH = 0, workedDays = 0;
      for (let d = 1; d <= elapsed; d++) {
        const e = monthData[d];
        if (!e || e.type === "descanso") continue;
        const h = Number(e.hours) || 0;
        if (h > 0) { workedDays++; workedH += h; }
      }
      
      if (workedDays < 3) return null;
      
      const avgH = workedH / workedDays;
      const projWorkDays = remaining * (workedDays / elapsed); 
      const projExtraH = projWorkDays * avgH;
      const projBruto = calcResult.bruto + projExtraH * config.rateNormal;
      const projDed = config.deductions.reduce((s, d) => s + (projBruto * d.pct) / 100, 0);
      
      return { projBruto, projNeto: projBruto - projDed, avgH, remaining };
    }

        const c = rec ? calcMonth(rec.days, state.config, dim, extraActive(state.config) ? calcExtraInfo(state.allData, state.year, m, dim) : null) : null;
        rows.push({ m, name: MESES_CORTO[m], neto: c ? c.neto : 0, bruto: c?.bruto||0, horas: c ? c.hNormal + c.hFestivo : 0, dias: c?.diasTrab||0, diasDesc: c?.diasDesc||0, hasData: !!(rec && Object.keys(rec.days||{}).length) });
      }
      return rows;
    }

    const eurPdf = (n) => (n || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    
    const BS = String.fromCharCode(92);
    
    function pdfEsc(s) {
      let out = "";
      for (const ch of String(s)) {
        const c = ch.codePointAt(0);
        if (c === 0x20AC) out += String.fromCharCode(128); else if (c === 0x2014 || c === 0x2013) out += "-";
        else if (c === 0x00B7) out += String.fromCharCode(183); else if (c > 255) out += "?"; else out += ch;
      }
      return out.split(BS).join(BS+BS).split("(").join(BS+"(").split(")").join(BS+")");
    }

    function createPdfDoc() {
      const pages = [[]]; let y = 786;
      const cur = () => pages[pages.length - 1];
      const addPage = () => { pages.push([]); y = 786; };
      const need = (h) => { if (y - h < 56) addPage(); };
      const txt = (x, s, o = {}) => {
        const size = o.size || 10; const tx = o.right ? x - (String(s).length * size * 0.5) : x;
        const col = o.color || (o.gray ? "0.45 0.48 0.55" : "0.08 0.1 0.14");
        cur().push(`BT /${o.bold ? "F2" : "F1"} ${size} Tf ${col} rg 1 0 0 1 ${tx.toFixed(1)} ${y.toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
      };
      const hr = () => { cur().push(`0.8 0.82 0.86 RG 0.6 w 40 ${(y + 3).toFixed(1)} m 555 ${(y + 3).toFixed(1)} l S`); };
      const down = (h) => { y -= h; };
      return { pages, txt, hr, down, need, addPage };
    }

    function assemblePdf(pages) {
      let out = "%PDF-1.4\n"; const offsets = []; const push = (s) => { offsets.push(out.length); out += s; };
      const n = pages.length; const kids = pages.map((_, i) => `${5 + i * 2} 0 R`).join(" ");
      push(`1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n`);
      push(`2 0 obj << /Type /Pages /Kids [${kids}] /Count ${n} >> endobj\n`);
      push(`3 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >> endobj\n`);
      push(`4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >> endobj\n`);
      pages.forEach((opsArr, i) => {
        const content = opsArr.join("\n");
        push(`${5 + i * 2} 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >> endobj\n`);
        push(`${6 + i * 2} 0 obj << /Length ${content.length} >> stream\n${content}\nendstream endobj\n`);
      });
      const xrefPos = out.length; const total = 5 + n * 2;
      out += `xref\n0 ${total}\n0000000000 65535 f \n`;
      offsets.forEach((o) => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
      out += `trailer << /Size ${total} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
      return out;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function processDownload(blob, filename) {
      try {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename }); return;
        }
      } catch(e) {}
      
      try {
        const base64 = await blobToBase64(blob);
        const a = document.createElement("a");
        a.href = base64;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => document.body.removeChild(a), 500);
      } catch(err) {
        alert("No se pudo descargar el archivo.");
      }
    }

      vibrate(20);
      state.month += dir; state.selectedDay = null;
      if (state.month < 0) { state.month = 11; state.year--; }
      if (state.month > 11) { state.month = 0; state.year++; }
      render(); 
    };
    
    window.selectDay = (d) => {
      vibrate(20);
      state.selectedDay = state.selectedDay === d ? null : d;
      const mk = monthKey(state.year, state.month);
      const ex = (state.allData[mk]?.days || {})[state.selectedDay];
      state.draft = ex ? { ...ex } : { type: "normal", hours: 8 };
      state.dayConfirmed = !!ex;
      
      renderCalendarGrid();
      renderEditor();
    };

    window.updateDraftType = (type) => {
      vibrate(20);
      state.draft.type = type;
      if (type === 'descanso') state.draft.hours = 0;
      state.dayConfirmed = false;
      renderEditor();
    };

    window.stepHours = (diff, val) => {
      vibrate(20);
      let current = Number(state.draft.hours) || 0;
      let h = val !== undefined ? Number(val) : current + diff;
      h = Math.max(0, Math.min(24, h));
      
      state.draft.hours = h;
      state.dayConfirmed = false;

      const inp = getEl('draft-hours');
      if (inp) {
        if (val === undefined) inp.value = h;
        inp.style.color = hoursColor(h);
      }

      const addBtn = getEl('btn-add-day');
      if (addBtn) addBtn.style.display = 'block';

      const earnBox = getEl('day-earn-box');
      if (earnBox) earnBox.style.display = 'none';
    };

    window.saveDay = () => {
      vibrate(100);
      const mk = monthKey(state.year, state.month);
      if(!state.allData[mk]) state.allData[mk] = { days: {} };
      state.allData[mk].days[state.selectedDay] = { type: state.draft.type, hours: state.draft.type === "descanso" ? 0 : Number(state.draft.hours) };
      state.dayConfirmed = true; 
      saveState(); 
      render(); 
    };
    
    window.clearDay = () => {
      vibrate(20);
      const mk = monthKey(state.year, state.month);
      if(state.allData[mk] && state.allData[mk].days) delete state.allData[mk].days[state.selectedDay];
      state.selectedDay = null; saveState(); render();
    }

    window.updateConfig = (k, v) => { 
      vibrate(100);
      state.config[k] = (k==='profile' || k==='userName') ? v : Number(v); 
      if (k === 'profile' && v !== 'sintax') state.config.sintaxUnlocked = false; 
      saveState(); render(); 
    };
    window.updateDed = (i, k, v) => { state.config.deductions[i][k] = k==='pct'?Number(v):v; saveState(); render(); };
    window.delDed = (i) => { vibrate(20); state.config.deductions.splice(i,1); saveState(); render(); };
    window.addDed = () => { vibrate(20); state.config.deductions.push({id:Date.now(), name:"Nueva", pct:0}); saveState(); render(); };
    window.unlockSintax = () => { vibrate(100); if(getEl('pw-sintax').value === 'Sintax_Granada') { state.config.sintaxUnlocked = true; saveState(); render(); } else alert("Error"); };

    window.exportBackup = () => {
      const b = new Blob([JSON.stringify({ config: state.config, data: state.allData })], {type:"application/json"});
      processDownload(b, `Backup_Horas_${new Date().toISOString().slice(0,10)}.json`);
    };
    window.importBackup = (e) => {
      const r = new FileReader(); r.onload = () => {
        try { const p = JSON.parse(r.result); state.config = {...DEFAULT_CONFIG, ...p.config,hideMoney:state.config.hideMoney}; state.allData = p.data||{}; saveState(); render(); alert("Importado con éxito"); } catch(e){ alert("Error"); }
      }; r.readAsText(e.target.files[0]);
    };

    window.renderChart = () => {
      const ctx = getEl('chart-anual'); if(!ctx) return;
      if(chartInst) chartInst.destroy();
      if(typeof Chart==='undefined'){const note=document.createElement('p');note.className='privacy-note';note.textContent='Gráfico no disponible. Puedes consultar las cifras del resumen.';ctx.replaceWith(note);return;}
      const rows = getAnnualData();
      chartInst = new Chart(ctx, {
        type: 'bar',
        data: { labels: rows.map(r=>r.name), datasets: [{ label: state.config.hideMoney?'Horas':'Neto estimado', data: rows.map(r=>state.config.hideMoney?r.horas:r.neto), backgroundColor: '#4FA3FF', borderRadius: 4 }] },
        options: { animation:matchMedia('(prefers-reduced-motion: reduce)').matches?false:{duration:180}, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display:true,ticks:{color:'#AFB8CC'}, grid: { color: '#2A3247' } }, x: { ticks:{color:'#AFB8CC'},grid: { display: false } } } }
      });
    };

    window.openExportModal = () => { vibrate(20); state.pdfReady = null; getEl('modal-export').style.display = 'flex'; renderModalExport(); };
    window.closeExport = () => { vibrate(20); getEl('modal-export').style.display = 'none'; };
    window.renderModalExport = () => {
      const m = getEl('modal-export-content'); if(!m) return;
      if (!state.pdfReady) {
        m.innerHTML = `
          <div style="font-family:'Space Grotesk', system-ui; font-weight:700; font-size:17px; margin-bottom:14px">Exportar PDF</div><p class="privacy-note">El PDF contiene datos económicos aunque estén ocultos en pantalla. Es un resumen estimado, no una nómina real.</p>
          <button class="big-btn" style="border-color:var(--accent); color:var(--accent); margin-bottom:16px" onclick="doExportMonth()">📄 Este mes · ${MESES[state.month]} ${state.year}</button>
          <div style="color:var(--muted); font-size:11px; font-weight:600; margin-bottom:8px">O AÑO COMPLETO</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            ${[state.year, state.year-1].map(y => `<button class="big-btn" style="flex:1 0 45%; padding:10px 0" onclick="doExportYear(${y})">🗓 ${y}</button>`).join('')}
          </div>
          <button style="width:100%; text-align:center; color:var(--muted); margin-top:16px; font-size:13px" onclick="closeExport()">Cancelar</button>
        `;
      } else {
        m.innerHTML = `
          <div style="font-family:'Space Grotesk', system-ui; font-weight:700; font-size:17px; margin-bottom:14px; color:var(--success)">✓ PDF Generado</div>
          <p style="color:var(--text); font-size:13px; word-break:break-all; margin-bottom:16px">${esc(state.pdfReady.filename)}</p>
          <button class="big-btn" style="border-color:var(--success); color:var(--success); margin-bottom:8px" onclick="processDownload(state.pdfReady.blob, state.pdfReady.filename)">⬇ Descargar / Compartir</button>
          <button style="width:100%; text-align:center; color:var(--muted); margin-top:8px; font-size:13px" onclick="closeExport()">Cerrar</button>
        `;
      }
    };

    try { const raw = localStorage.getItem("horas-app-v2"); if (raw) { const p = JSON.parse(raw); state.config = { ...DEFAULT_CONFIG, ...(p.config||{}) }; state.allData = p.data||{}; } } catch(e){}
    const moneyPreference=localStorage.getItem(MONEY_KEY);
    if(moneyPreference!==null)state.config.hideMoney=moneyPreference==='1';
    localStorage.setItem(MONEY_KEY,state.config.hideMoney?'1':'0');
    render();

    // ============================================================
    // PWA: REGISTRO DEL SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn("SW no registrado:", e));
    }
  </script>
</body>
</html>
