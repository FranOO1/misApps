```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Guardian</title>
    <!-- Tailwind para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modal { transition: opacity 0.3s ease-out; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800 font-sans">

    <div class="max-w-md mx-auto p-4">
        
        <!-- CABECERA -->
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h1 class="text-xl font-bold text-green-600 flex items-center gap-2">
                <span>🌿</span> Plant Guardian
            </h1>
            <div class="space-x-1 flex">
                <button onclick="toggleChat()" class="p-2.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition shadow-sm" title="IA Botánico">🤖</button>
                <button onclick="exportData()" class="p-2.5 bg-gray-50 text-gray-600 rounded-xl hover:bg-gray-100 transition shadow-sm" title="Exportar Backup">💾</button>
                <label class="p-2.5 bg-gray-50 text-gray-600 rounded-xl hover:bg-gray-100 transition shadow-sm cursor-pointer" title="Importar Backup">
                    📂 <input type="file" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>
        </header>

        <!-- LISTA DE PLANTAS -->
        <div id="plant-list" class="grid gap-4">
            <!-- Las tarjetas se generan aquí vía JS -->
        </div>
    </div>

    <!-- BOTÓN FLOTANTE (FAB) -->
    <button onclick="openModal('add-modal')" class="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full shadow-lg shadow-green-500/30 flex items-center justify-center text-3xl font-light hover:bg-green-600 active:scale-90 transition-all z-10">
        +
    </button>

    <!-- MODAL: AÑADIR PLANTA -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-50 modal opacity-0">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 transform translate-y-full modal-content" id="add-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Nueva Planta</h2>
                <button onclick="closeModal('add-modal')" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200">❌</button>
            </div>
            <form onsubmit="savePlant(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 ml-1">Nombre</label>
                    <input id="p-name" required placeholder="Ej: Poto, Monstera..." class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-green-500 focus:bg-white transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-gray-500 ml-1">Ubicación</label>
                        <input id="p-loc" required placeholder="Salón" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-green-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 ml-1">Tipo</label>
                        <input id="p-type" placeholder="Suculenta" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-green-500 focus:bg-white transition">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-gray-500 ml-1">Riego (días)</label>
                        <input id="p-freq" type="number" required min="1" value="7" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-green-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 ml-1">Último riego</label>
                        <input id="p-last" type="date" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-green-500 focus:bg-white transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-500 text-white py-3.5 rounded-xl font-bold mt-4 shadow-lg shadow-green-500/20 active:scale-95 transition">Guardar Planta</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CHAT IA -->
    <div id="chat-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex flex-col z-50 modal opacity-0">
        <div class="flex flex-col flex-1 w-full max-w-md mx-auto bg-white sm:rounded-3xl shadow-2xl overflow-hidden transform translate-y-full modal-content mt-4 sm:my-4" id="chat-modal-content">
            <div class="px-5 py-4 bg-blue-500 text-white flex justify-between items-center">
                <div>
                    <h2 class="font-bold flex items-center gap-2">🤖 Experto Botánico</h2>
                    <p class="text-[10px] text-blue-200 uppercase tracking-wider">Potenciado por Gemini</p>
                </div>
                <button onclick="toggleChat()" class="p-2 hover:bg-blue-600 rounded-full transition">❌</button>
            </div>
            
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
                <div class="flex gap-2">
                    <div class="bg-blue-100 text-blue-800 p-3.5 rounded-2xl rounded-tl-none text-sm shadow-sm border border-blue-200/50">
                        ¡Hola Fran! Pregúntame dudas sobre tus plantas o dime los síntomas si las ves pochillas.
                    </div>
                </div>
            </div>
            
            <form onsubmit="sendChat(event)" class="p-3 border-t border-gray-200 bg-white flex gap-2">
                <input id="chat-input" placeholder="Pregunta algo..." class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500 transition" autocomplete="off">
                <button type="submit" id="chat-submit" class="bg-blue-500 text-white px-5 rounded-xl font-bold hover:bg-blue-600 active:scale-95 transition disabled:opacity-50">Enviar</button>
            </form>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT NATIVA -->
    <script>
        // Utilidades de Fecha
        const getToday = () => new Date().toISOString().split('T')[0];
        document.getElementById('p-last').max = getToday();
        document.getElementById('p-last').value = getToday();

        const addDays = (dateStr, days) => {
            const d = new Date(dateStr);
            d.setDate(d.getDate() + parseInt(days));
            return d.toISOString().split('T')[0];
        };

        const formatDate = (dateStr) => {
            return new Date(dateStr).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
        };

        // --- MOTOR DE DATOS: INDEXED DB ---
        let db;
        const initDB = () => {
            const req = indexedDB.open("PlantGuardianDB", 1);
            req.onupgradeneeded = e => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains("plants")) {
                    database.createObjectStore("plants", { keyPath: "id" });
                }
            };
            req.onsuccess = e => { 
                db = e.target.result; 
                renderPlants(); 
            };
        };

        // --- INTERFAZ PRINCIPAL ---
        function renderPlants() {
            db.transaction("plants").objectStore("plants").getAll().onsuccess = e => {
                const plants = e.target.result;
                const list = document.getElementById('plant-list');
                
                if(plants.length === 0) {
                    list.innerHTML = `
                        <div class="text-center p-8 text-gray-400 border-2 border-dashed border-gray-200 rounded-3xl mt-10 bg-white">
                            <span class="text-4xl block mb-2">🪴</span>
                            <p class="font-medium">Tu selva está vacía</p>
                            <p class="text-sm mt-1">Usa el botón + para empezar</p>
                        </div>`;
                    return;
                }

                // Ordenar: las que necesitan riego primero
                plants.sort((a,b) => new Date(addDays(a.last, a.freq)) - new Date(addDays(b.last, b.freq)));

                list.innerHTML = plants.map(p => {
                    const nextDateStr = addDays(p.last, p.freq);
                    const isOverdue = nextDateStr < getToday();
                    const isTodayDue = nextDateStr === getToday();
                    const needsWater = isOverdue || isTodayDue;
                    
                    const borderColor = isOverdue ? 'border-red-400' : 'border-gray-100';
                    const badge = isOverdue 
                        ? '<span class="absolute -top-2.5 -right-2 bg-red-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-md animate-pulse">¡Atrasada!</span>' 
                        : '';
                    
                    return `
                    <div class="bg-white p-5 rounded-3xl shadow-sm border relative transition-all ${borderColor}">
                        ${badge}
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="font-bold text-lg leading-tight text-gray-900">${p.name}</h2>
                                <p class="text-xs text-gray-500 font-medium mt-1">📍 ${p.loc} ${p.type ? `• ${p.type}` : ''}</p>
                            </div>
                            <button onclick="deletePlant('${p.id}')" class="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition">🗑️</button>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-gray-50 flex justify-between items-end">
                            <div>
                                <span class="text-gray-400 block uppercase font-bold text-[10px] tracking-wider mb-0.5">Próximo riego</span>
                                <span class="text-sm ${isOverdue ? 'text-red-500 font-bold' : isTodayDue ? 'text-yellow-600 font-bold' : 'text-gray-700 font-medium'} flex items-center gap-1">
                                    🗓️ ${isTodayDue ? '¡Hoy!' : formatDate(nextDateStr)} 
                                    <span class="text-[10px] text-gray-400 font-normal ml-1">(${p.freq}d)</span>
                                </span>
                            </div>
                            <button onclick="water('${p.id}')" class="${needsWater ? 'bg-blue-500 text-white shadow-md shadow-blue-500/20' : 'bg-blue-50 text-blue-600'} px-5 py-2.5 rounded-xl text-sm font-bold active:scale-95 transition">
                                💧 Regar
                            </button>
                        </div>
                    </div>`;
                }).join('');
            };
        }

        // --- ACCIONES CRUD ---
        function savePlant(e) {
            e.preventDefault();
            const newPlant = {
                id: Date.now().toString(),
                name: document.getElementById('p-name').value,
                loc: document.getElementById('p-loc').value,
                type: document.getElementById('p-type').value,
                freq: parseInt(document.getElementById('p-freq').value),
                last: document.getElementById('p-last').value
            };
            
            const tx = db.transaction("plants", "readwrite");
            tx.objectStore("plants").put(newPlant);
            tx.oncomplete = () => { 
                closeModal('add-modal'); 
                renderPlants(); 
                e.target.reset(); 
                document.getElementById('p-last').value = getToday(); 
            };
        }

        function water(id) {
            const tx = db.transaction("plants", "readwrite");
            const store = tx.objectStore("plants");
            store.get(id).onsuccess = e => {
                const p = e.target.result;
                p.last = getToday();
                store.put(p);
                renderPlants();
            };
        }

        function deletePlant(id) {
            // Usamos un modal custom en vez de confirm() porque los iframe bloquean los alert/confirm nativos a veces.
            // Para simplificar esta demo, lo eliminamos directo. En producción añadiríamos un mini-modal de confirmación.
            db.transaction("plants", "readwrite").objectStore("plants").delete(id).onsuccess = renderPlants;
        }

        // --- GESTIÓN DE DATOS ---
        function exportData() {
            db.transaction("plants", "readonly").objectStore("plants").getAll().onsuccess = e => {
                const data = e.target.result;
                if(data.length === 0) return;
                
                const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "plantguardian_backup.json";
                a.click();
            };
        }

        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    const tx = db.transaction("plants", "readwrite");
                    data.forEach(p => tx.objectStore("plants").put(p));
                    tx.oncomplete = renderPlants;
                } catch(err) { 
                    console.error("Error al importar", err); 
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset input
        }

        // --- CONTROL DE MODALES (Animaciones) ---
        function openModal(id) {
            const modal = document.getElementById(id);
            const content = document.getElementById(id+'-content');
            modal.classList.remove('hidden');
            // Timeout para que el render detecte el display block antes de animar opacity
            setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                content.classList.remove('translate-y-full'); 
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            const content = document.getElementById(id+'-content');
            modal.classList.add('opacity-0'); 
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function toggleChat() {
            const m = document.getElementById('chat-modal');
            if(m.classList.contains('hidden')) openModal('chat-modal');
            else closeModal('chat-modal');
        }

        // --- IA BOTÁNICO (Integración Gemini) ---
        async function sendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const submitBtn = document.getElementById('chat-submit');
            const text = input.value.trim();
            if(!text) return;
            
            const chat = document.getElementById('chat-history');
            
            // Añadir mensaje de Fran
            chat.innerHTML += `
                <div class="flex gap-2 flex-row-reverse">
                    <div class="bg-green-500 text-white p-3.5 rounded-2xl rounded-tr-none text-sm shadow-sm">${text}</div>
                </div>`;
            
            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            chat.scrollTop = chat.scrollHeight;

            // API Key inyectada por el entorno
            const apiKey = ""; 
            const payload = {
                contents: [{ parts: [{ text }] }],
                systemInstruction: { parts: [{ text: "Eres PlantGuardian AI, experto botánico. Hablas con Fran. Respuestas útiles, concisas, con emojis. Tono amable pero directo." }] }
            };

            const loadingId = 'ai-loading-' + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="flex gap-2"><div class="bg-gray-200 text-gray-500 p-3.5 rounded-2xl rounded-tl-none text-sm animate-pulse">Analizando botánicamente...</div></div>`;
            chat.scrollTop = chat.scrollHeight;

            // Lógica de reintentos (Backoff exponencial)
            const delays = [1000, 2000, 4000];
            let responseText = "Vaya, se me ha cruzado un cable. Inténtalo de nuevo.";

            for (let i = 0; i <= delays.length; i++) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify(payload)
                    });
                    
                    if(!res.ok) throw new Error("API Falla");
                    const data = await res.json();
                    
                    if(data.candidates && data.candidates[0].content.parts[0].text) {
                        responseText = data.candidates[0].content.parts[0].text;
                        break; // Éxito
                    }
                } catch(err) {
                    if (i === delays.length) break; 
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }

            document.getElementById(loadingId)?.remove();
            
            // Render de Markdown básico (negritas) a HTML simple
            const formattedText = responseText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

            chat.innerHTML += `
                <div class="flex gap-2">
                    <div class="bg-white border border-gray-200 text-gray-800 p-3.5 rounded-2xl rounded-tl-none text-sm shadow-sm">
                        ${formattedText}
                    </div>
                </div>`;
            
            input.disabled = false;
            submitBtn.disabled = false;
            input.focus();
            chat.scrollTop = chat.scrollHeight;
        }

        // Arrancar la base de datos al cargar la vista
        window.onload = initDB;
    </script>
</body>
</html>
