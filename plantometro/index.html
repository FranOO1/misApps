<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Guardian Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <link rel="manifest" href="./manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                console.log("Service Worker Activo");
            });
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modal-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 pb-24 min-h-screen">

    <header class="sticky top-0 z-10 px-4 py-4 shadow-sm border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-white dark:bg-gray-900 transition-colors">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-green-500 w-6 h-6"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 8.5C18.5 14 14 19 11 20z"></path><path d="M19 2c-2.26 4.33-5.27 7.14-8 10"></path></svg>
            <h1 class="font-bold text-xl tracking-tight text-gray-800 dark:text-gray-100">Plant Guardian</h1>
        </div>
        
        <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800/50 p-1 rounded-xl border border-gray-200/60 dark:border-gray-700/60">
            <button onclick="toggleModal('chat-modal')" class="p-2 rounded-lg text-blue-600 dark:text-blue-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
            </button>
            <div class="w-px h-4 bg-gray-200 dark:bg-gray-700"></div>
            <label class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
                <input type="file" class="hidden" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="exportData()" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
            </button>
            <button onclick="toggleModal('settings-modal')" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </header>

    <div class="px-4 py-4 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900/60 shadow-inner">
        <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
            <div class="flex items-start gap-2.5 flex-1 p-3 bg-green-50/60 dark:bg-green-950/20 rounded-2xl border border-green-100/50 dark:border-green-900/30">
                <span class="text-xl">💡</span>
                <div>
                    <p class="text-[10px] font-bold text-green-700 dark:text-green-400 uppercase tracking-wider mb-0.5">Tip de Fran</p>
                    <p id="daily-tip" class="text-sm font-medium text-gray-700 dark:text-gray-300 italic">🌿 Mantén las hojas limpias de polvo para que respiren.</p>
                </div>
            </div>
            <div class="flex flex-col items-end gap-2 p-3 rounded-2xl bg-gray-50 dark:bg-gray-800/80 shadow-sm border border-gray-200/80 dark:border-gray-700 w-full sm:w-auto">
                <div class="flex items-center gap-4 text-xs font-semibold text-gray-700 dark:text-gray-300">
                    <span class="flex items-center gap-1 text-orange-600">☀️ 24°C</span>
                    <span class="flex items-center gap-1 text-blue-500">💧 45%</span>
                    <span id="city-display" class="bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-600 dark:text-gray-400">Granada</span>
                </div>
                <button onclick="autoAdjustWatering()" class="w-full text-[11px] font-bold px-3 py-2 rounded-xl bg-green-600 text-white shadow-sm transition hover:bg-green-700">
                    Ajustar riegos al clima
                </button>
            </div>
        </div>
    </div>

    <main class="p-4 max-w-2xl mx-auto">
        <div id="filter-container" class="mb-6 flex overflow-x-auto pb-2 gap-2 hide-scrollbar"></div>
        <div id="plant-list" class="grid gap-4"></div>
    </main>

    <button onclick="openFormModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-green-600 text-white rounded-full shadow-xl shadow-green-600/30 flex items-center justify-center hover:bg-green-700 active:scale-95 transition-all z-20 text-3xl font-light">
        +
    </button>

    <div id="form-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 modal-enter border-t sm:border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold" id="form-title">Nueva Planta</h2>
                <button onclick="toggleModal('form-modal')" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 flex items-center justify-center font-bold">✕</button>
            </div>
            <form onsubmit="savePlant(event)" class="space-y-4">
                <input type="hidden" id="p-id">
                <input id="p-name" required placeholder="Nombre (Ej: Monstera)" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                <div class="grid grid-cols-2 gap-3">
                    <input id="p-loc" required placeholder="Ubicación" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                    <input id="p-type" placeholder="Tipo (Opcional)" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">Cada cuántos días</label>
                        <input id="p-freq" type="number" required min="1" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">Último Riego</label>
                        <input id="p-last" type="date" required class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <textarea id="p-notes" placeholder="Notas de cuidados..." rows="2" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 resize-none"></textarea>
                <button type="submit" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold flex justify-center gap-2 items-center shadow-md hover:bg-green-700 active:scale-95 transition">
                    Guardar Planta
                </button>
            </form>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 modal-enter border-t sm:border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Ajustes</h2>
                <button onclick="toggleModal('settings-modal')" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 flex items-center justify-center font-bold">✕</button>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase block mb-2">Tema visual</label>
                    <div class="flex gap-2">
                        <button onclick="setTheme('light')" class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-center gap-2 items-center font-medium shadow-sm bg-gray-50 dark:bg-gray-900" id="btn-light">☀️ Claro</button>
                        <button onclick="setTheme('dark')" class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-center gap-2 items-center font-medium shadow-sm bg-gray-50 dark:bg-gray-900" id="btn-dark">🌙 Oscuro</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase block mb-2">Ciudad (Clima IA)</label>
                    <input id="s-city" type="text" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <button onclick="saveSettings()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold hover:bg-green-700 shadow-md">Guardar Ajustes</button>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex flex-col z-50">
        <div class="flex flex-col flex-1 w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 sm:rounded-3xl shadow-2xl overflow-hidden mt-4 sm:my-4 modal-enter">
            <div class="px-5 py-4 bg-blue-600 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h2 class="font-bold text-lg leading-tight">🤖 Experto Botánico</h2>
                </div>
                <button onclick="toggleModal('chat-modal')" class="w-8 h-8 rounded-full bg-blue-700 hover:bg-blue-800 flex items-center justify-center font-bold">✕</button>
            </div>
            
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-900/50">
                <div class="flex gap-3">
                    <div class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-3.5 rounded-2xl rounded-tl-none text-sm max-w-[85%] shadow-sm">¡Hola Fran! ¿Qué le pasa a tus plantas hoy?</div>
                </div>
            </div>
            
            <form onsubmit="sendChat(event)" class="p-3 border-t border-gray-200 dark:border-gray-700 flex gap-2 bg-white dark:bg-gray-800">
                <input id="chat-input" placeholder="Pregunta algo..." class="flex-1 p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
                <button type="submit" id="chat-submit" class="bg-blue-600 text-white px-5 rounded-xl flex items-center justify-center hover:bg-blue-700 active:scale-95 transition shrink-0 font-bold shadow-md">
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script>
        const getTodayDate = () => new Date().toISOString().split('T')[0];
        const addDaysToDate = (dStr, days) => { const d = new Date(dStr); d.setDate(d.getDate() + parseInt(days)); return d.toISOString().split('T')[0]; };
        const formatUIDate = (dStr) => new Date(dStr).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
        document.getElementById('p-last').max = getTodayDate();

        let settings = JSON.parse(localStorage.getItem('pg_settings')) || { theme: 'light', city: 'Granada, España' };
        let activeFilter = 'Todas';

        function applySettings() {
            document.getElementById('s-city').value = settings.city;
            document.getElementById('city-display').innerText = settings.city.split(',')[0];
            if (settings.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('btn-dark').classList.add('border-green-600', 'text-green-600', 'bg-green-50/10');
                document.getElementById('btn-light').classList.remove('border-green-600', 'text-green-600', 'bg-green-50/10');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('btn-light').classList.add('border-green-600', 'text-green-600', 'bg-green-50/30');
                document.getElementById('btn-dark').classList.remove('border-green-600', 'text-green-600', 'bg-green-50/30');
            }
        }

        function setTheme(t) { settings.theme = t; applySettings(); }
        function saveSettings() {
            settings.city = document.getElementById('s-city').value;
            localStorage.setItem('pg_settings', JSON.stringify(settings));
            applySettings();
            toggleModal('settings-modal');
        }

        let db;
        const initDB = () => {
            const req = indexedDB.open("PlantGuardianProDB", 1);
            req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains("plants")) e.target.result.createObjectStore("plants", { keyPath: "id" }); };
            req.onsuccess = e => { db = e.target.result; renderPlants(); };
        };

        function renderPlants() {
            db.transaction("plants").objectStore("plants").getAll().onsuccess = e => {
                const allPlants = e.target.result;
                const list = document.getElementById('plant-list');
                const filters = document.getElementById('filter-container');
                
                const locs = ['Todas', ...new Set(allPlants.map(p => p.loc))];
                if(locs.length > 1) {
                    filters.innerHTML = locs.map(l => `
                        <button onclick="setFilter('${l}')" class="px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap transition-colors ${activeFilter === l ? 'bg-green-600 text-white shadow-sm' : 'bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800'}">
                            ${l}
                        </button>
                    `).join('');
                } else { filters.innerHTML = ''; }

                let filtered = activeFilter === 'Todas' ? allPlants : allPlants.filter(p => p.loc === activeFilter);
                filtered.sort((a,b) => new Date(addDaysToDate(a.last, a.freq)) - new Date(addDaysToDate(b.last, b.freq)));

                if(filtered.length === 0) {
                    list.innerHTML = `
                        <div class="text-center mt-12 p-10 rounded-3xl border-2 border-dashed border-gray-300 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-sm max-w-md mx-auto">
                            <span class="text-4xl block mb-3">🪴</span>
                            <h2 class="text-lg font-bold text-gray-700 dark:text-gray-300">Tu selva está vacía</h2>
                            <p class="text-sm text-gray-400 mt-1">Pulsa el botón verde "+" de abajo para registrar tu primera planta.</p>
                        </div>`;
                    return;
                }
