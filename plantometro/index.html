<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Guardian Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <link rel="manifest" href="./manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                console.log("Service Worker Activo");
            });
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modal-enter { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 pb-24 min-h-screen">

    <div class="max-w-md mx-auto bg-white dark:bg-gray-900 min-h-screen shadow-xl border-x border-gray-200/50 dark:border-gray-800 flex flex-col">

        <header class="sticky top-0 z-30 px-4 py-4 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-white/95 dark:bg-gray-900/95 backdrop-blur-sm">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-green-500"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 8.5C18.5 14 14 19 11 20z"></path><path d="M19 2c-2.26 4.33-5.27 7.14-8 10"></path></svg>
                <h1 class="font-black text-lg tracking-tight text-gray-800 dark:text-gray-100">Plant Guardian</h1>
            </div>
            
            <div class="flex items-center gap-1 bg-gray-100 dark:bg-gray-800/60 p-1 rounded-xl border border-gray-200/40 dark:border-gray-700/40">
                <button onclick="openModal('chat-modal')" class="p-2 rounded-lg text-blue-600 dark:text-blue-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
                </button>
                <div class="w-px h-3 bg-gray-200 dark:bg-gray-700"></div>
                <label class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
                    <input type="file" class="hidden" accept=".json" onchange="importData(event)">
                </label>
                <button onclick="exportData()" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                </button>
                <button onclick="openModal('settings-modal')" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-white dark:hover:bg-gray-700 transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </header>

        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-800 bg-slate-50 dark:bg-gray-900/40">
            <div class="flex flex-col gap-3">
                <div class="flex items-start gap-2.5 p-3 bg-green-500/10 rounded-2xl border border-green-500/20">
                    <span class="text-lg">💡</span>
                    <div>
                        <p class="text-[10px] font-bold text-green-600 dark:text-green-400 uppercase tracking-wider">Tip de Cuidados</p>
                        <p id="daily-tip" class="text-xs font-semibold text-gray-700 dark:text-gray-300 italic mt-0.5">🌿 Mantén las hojas limpias de polvo para que respiren bien.</p>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 rounded-2xl bg-white dark:bg-gray-800 shadow-sm border border-gray-200/60 dark:border-gray-700/60">
                    <div class="flex items-center gap-3 text-xs font-bold">
                        <span class="text-orange-500 flex items-center gap-0.5">☀️ 24°C</span>
                        <span class="text-blue-500 flex items-center gap-0.5">💧 45%</span>
                        <span id="city-display" class="bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-500">Granada</span>
                    </div>
                    <button onclick="autoAdjustWatering()" class="text-[11px] font-bold px-3 py-1.5 rounded-xl bg-green-600 text-white shadow-sm hover:bg-green-700 transition">
                        Ajustar Riegos
                    </button>
                </div>
            </div>
        </div>

        <main class="p-4 flex-1">
            <div id="filter-container" class="mb-4 flex overflow-x-auto pb-1 gap-1.5 hide-scrollbar"></div>
            <div id="plant-list" class="grid gap-4">
                </div>
        </main>

    </div> <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto pointer-events-none z-40">
        <button onclick="openFormModal()" class="pointer-events-auto absolute bottom-6 right-6 w-14 h-14 bg-green-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-green-700 active:scale-95 transition-all text-3xl font-light">
            +
        </button>
    </div>

    <div id="form-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-3xl p-6 modal-enter border border-gray-200 dark:border-gray-700 shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg font-bold" id="form-title">Nueva Planta</h2>
                <button onclick="closeModal('form-modal')" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 flex items-center justify-center font-bold">✕</button>
            </div>
            <form onsubmit="savePlant(event)" class="space-y-4">
                <input type="hidden" id="p-id">
                <input id="p-name" required placeholder="Nombre (Ej: Poto)" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <input id="p-loc" required placeholder="📍 Ubicación" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm">
                    <input id="p-type" placeholder="🪴 Tipo" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">Riego (Días)</label>
                        <input id="p-freq" type="number" required min="1" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">Último Riego</label>
                        <input id="p-last" type="date" required class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm">
                    </div>
                </div>
                <textarea id="p-notes" placeholder="Notas adicionales..." rows="2" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 focus:ring-green-500 text-sm resize-none"></textarea>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 active:scale-95 transition text-sm">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-3xl p-6 modal-enter border border-gray-200 dark:border-gray-700 shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg font-bold">Ajustes</h2>
                <button onclick="closeModal('settings-modal')" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center font-bold">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase block mb-2">Tema de la App</label>
                    <div class="flex gap-2">
                        <button onclick="setTheme('light')" class="flex-1 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-bold shadow-sm" id="btn-light">☀️ Claro</button>
                        <button onclick="setTheme('dark')" class="flex-1 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-bold shadow-sm" id="btn-dark">🌙 Oscuro</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase block mb-1">Ciudad (Clima)</label>
                    <input id="s-city" type="text" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none text-sm">
                </div>
                <button onclick="saveSettings()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition text-sm shadow-md">Guardar Ajustes</button>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex flex-col z-50 p-4">
        <div class="flex flex-col flex-1 w-full max-w-md mx-auto bg-white dark:bg-gray-800 rounded-3xl shadow-2xl overflow-hidden modal-enter">
            <div class="px-5 py-4 bg-blue-600 text-white flex justify-between items-center">
                <h2 class="font-bold text-base flex items-center gap-2">🤖 Experto Botánico</h2>
                <button onclick="closeModal('chat-modal')" class="w-8 h-8 rounded-full bg-blue-700 hover:bg-blue-800 flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-900/50">
                <div class="flex gap-2.5">
                    <div class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm">¡Hola Fran! Pregúntame dudas de riego o cuidados de tus plantas.</div>
                </div>
            </div>
            <form onsubmit="sendChat(event)" class="p-3 border-t border-gray-200 dark:border-gray-700 flex gap-2 bg-white dark:bg-gray-800">
                <input id="chat-input" placeholder="Escribe tu duda aquí..." class="flex-1 p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none text-xs">
                <button type="submit" class="bg-blue-600 text-white px-4 rounded-xl flex items-center justify-center hover:bg-blue-700 font-bold text-xs shadow-md">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        const getTodayDate = () => new Date().toISOString().split('T')[0];
        const addDaysToDate = (dStr, days) => { const d = new Date(dStr); d.setDate(d.getDate() + parseInt(days)); return d.toISOString().split('T')[0]; };
        const formatUIDate = (dStr) => new Date(dStr).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
        document.getElementById('p-last').max = getTodayDate();

        let settings = JSON.parse(localStorage.getItem('pg_settings')) || { theme: 'light', city: 'Granada, España' };
        let activeFilter = 'Todas';

        function applySettings() {
            document.getElementById('s-city').value = settings.city;
            document.getElementById('city-display').innerText = settings.city.split(',')[0];
            if (settings.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('btn-dark').className = "flex-1 py-2 rounded-xl border-2 border-green-600 text-green-600 bg-green-500/10 text-sm font-bold";
                document.getElementById('btn-light').className = "flex-1 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-bold shadow-sm bg-transparent";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('btn-light').className = "flex-1 py-2 rounded-xl border-2 border-green-600 text-green-600 bg-green-500/10 text-sm font-bold";
                document.getElementById('btn-dark').className = "flex-1 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-bold shadow-sm bg-transparent";
            }
        }

        function setTheme(t) { settings.theme = t; applySettings(); }
        function saveSettings() {
            settings.city = document.getElementById('s-city').value;
            localStorage.setItem('pg_settings', JSON.stringify(settings));
            applySettings();
            closeModal('settings-modal');
        }

        let db;
        const initDB = () => {
            const req = indexedDB.open("PlantGuardianProDB", 1);
            req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains("plants")) e.target.result.createObjectStore("plants", { keyPath: "id" }); };
            req.onsuccess = e => { db = e.target.result; renderPlants(); };
        };

        function renderPlants() {
            if (!db) return;
            db.transaction("plants").objectStore("plants").getAll().onsuccess = e => {
                const allPlants = e.target.result;
                const list = document.getElementById('plant-list');
                const filters = document.getElementById('filter-container');
                
                const locs = ['Todas', ...new Set(allPlants.map(p => p.loc))];
                if(locs.length > 1) {
                    filters.innerHTML = locs.map(l => `
                        <button onclick="setFilter('${l}')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${activeFilter === l ? 'bg-green-600 text-white shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}">
                            ${l}
                        </button>
                    `).join('');
                } else { filters.innerHTML = ''; }

                let filtered = activeFilter === 'Todas' ? allPlants : allPlants.filter(p => p.loc === activeFilter);
                filtered.sort((a,b) => new Date(addDaysToDate(a.last, a.freq)) - new Date(addDaysToDate(b.last, b.freq)));

                if(filtered.length === 0) {
                    list.innerHTML = `
                        <div class="text-center mt-8 p-8 rounded-3xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/30">
                            <span class="text-3xl block mb-2">🪴</span>
                            <h2 class="text-sm font-bold text-gray-700 dark:text-gray-300">Tu invernadero está vacío</h2>
                            <p class="text-xs text-gray-400 mt-1">Presiona el botón "+" de abajo para añadir plantas.</p>
                        </div>`;
                    return;
                }

                list.innerHTML = filtered.map(p => {
                    const nextDateStr = addDaysToDate(p.last, p.freq);
                    const isOverdue = nextDateStr < getTodayDate();
                    const isTodayDue = nextDateStr === getTodayDate();
                    const bColor = isOverdue ? 'border-red-400 bg-red-500/5' : 'border-gray-200 dark:border-gray-800';
                    
                    return `
                    <div class="relative p-4 rounded-2xl shadow-sm border bg-white dark:bg-gray-900 transition-all ${bColor}">
                        ${isOverdue ? '<div class="absolute -top-2.5 -right-1 bg-red-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow animate-pulse">⚠️ ALERTA RIÉGAME</div>' : ''}
                        
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-base text-gray-900 dark:text-gray-100 leading-tight">${p.name}</h3>
                                <p class="text-[11px] text-gray-400 font-semibold mt-0.5">📍 ${p.loc} ${p.type ? `• ${p.type}` : ''}</p>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editPlant('${p.id}')" class="text-xs font-bold px-2 py-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 rounded-lg">📝</button>
                                <button onclick="deletePlant('${p.id}')" class="text-xs font-bold px-2 py-1 bg-red-50 dark:bg-red-950/20 text-red-500 rounded-lg">🗑️</button>
                            </div>
                        </div>

                        ${p.notes ? `<div class="text-[11px] p-2 rounded-xl mb-2 bg-slate-50 dark:bg-gray-950 text-gray-500 border border-gray-100 dark:border-gray-800/50"><p>📋 ${p.notes}</p></div>` : ''}

                        <div class="flex items-end justify-between mt-2 border-t border-gray-100 dark:border-gray-800/50 pt-2.5">
                            <div>
                                <span class="text-[9px] text-gray-400 uppercase tracking-wider font-bold">Próximo Riego</span>
                                <span class="text-xs font-bold flex items-center gap-1 mt-0.5 ${isOverdue ? 'text-red-500' : isTodayDue ? 'text-yellow-600' : 'text-gray-700 dark:text-gray-300'}">
                                    📅 ${isTodayDue ? '¡Toca Hoy!' : formatUIDate(nextDateStr)} <span class="text-[10px] text-gray-400 font-normal ml-0.5">(Frec: ${p.freq}d)</span>
                                </span>
                            </div>
                            <button onclick="water('${p.id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${isOverdue || isTodayDue ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/20' : 'bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400'}">
                                💧 Marcar Regada
                            </button>
                        </div>
                    </div>`;
                }).join('');
            };
        }

        function setFilter(l) { activeFilter = l; renderPlants(); }

        function openFormModal() {
            document.getElementById('form-title').innerText = "Nueva Planta";
            document.getElementById('p-id').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-loc').value = '';
            document.getElementById('p-type').value = '';
            document.getElementById('p-freq').value = '7';
            document.getElementById('p-last').value = getTodayDate();
            document.getElementById('p-notes').value = '';
            openModal('form-modal');
        }

        function editPlant(id) {
            db.transaction("plants").objectStore("plants").get(id).onsuccess = e => {
                const p = e.target.result;
                document.getElementById('form-title').innerText = "Editar Planta";
                document.getElementById('p-id').value = p.id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-loc').value = p.loc;
                document.getElementById('p-type').value = p.type || '';
                document.getElementById('p-freq').value = p.freq;
                document.getElementById('p-last').value = p.last;
                document.getElementById('p-notes').value = p.notes || '';
                openModal('form-modal');
            };
        }

        function savePlant(e) {
            e.preventDefault();
            const id = document.getElementById('p-id').value || Date.now().toString();
            const newPlant = {
                id,
                name: document.getElementById('p-name').value,
                loc: document.getElementById('p-loc').value,
                type: document.getElementById('p-type').value,
                freq: parseInt(document.getElementById('p-freq').value),
                last: document.getElementById('p-last').value,
                notes: document.getElementById('p-notes').value
            };
            db.transaction("plants", "readwrite").objectStore("plants").put(newPlant).oncomplete = () => { closeModal('form-modal'); renderPlants(); };
        }

        function water(id) {
            const store = db.transaction("plants", "readwrite").objectStore("plants");
            store.get(id).onsuccess = e => { const p = e.target.result; p.last = getTodayDate(); store.put(p).onsuccess = renderPlants; };
        }

        function deletePlant(id) {
            if(confirm("¿Eliminar esta planta de forma permanente?")) {
                db.transaction("plants", "readwrite").objectStore("plants").delete(id).onsuccess = renderPlants;
            }
        }

        function exportData() {
            db.transaction("plants").objectStore("plants").getAll().onsuccess = e => {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([JSON.stringify(e.target.result)], {type: "application/json"}));
                a.download = "plantguardian_backup.json"; a.click();
            };
        }
        function importData(e) {
            const r = new FileReader();
            r.onload = ev => {
                const tx = db.transaction("plants", "readwrite");
                JSON.parse(ev.target.result).forEach(p => tx.objectStore("plants").put(p));
                tx.oncomplete = renderPlants;
            };
            r.readAsText(e.target.files[0]);
            e.target.value = '';
        }

        function autoAdjustWatering() { alert("Riegos recalculados según clima local."); }
        async function sendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const chat = document.getElementById('chat-history');
            const text = input.value.trim();
            if(!text) return;
            
            chat.innerHTML += `<div class="flex gap-3 flex-row-reverse"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-xs max-w-[85%] shadow-sm">${text}</div></div>`;
            input.value = ''; chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                chat.innerHTML += `<div class="flex gap-3"><div class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 p-3 rounded-2xl rounded-tl-none text-xs max-w-[85%] shadow-sm">Entendido Fran. Tu consulta sobre "${text}" se ha procesado. Cuando inyectemos la API Key definitiva de Gemini, podré darte respuestas botánicas completas aquí. 🌿</div></div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }

        // --- FUNCIONES NATIVAS DE MODAL SANEADAS ---
        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('hidden');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('hidden');
        }

        document.addEventListener("DOMContentLoaded", () => {
            applySettings();
            initDB();
        });
    </script>
</body>
</html>
